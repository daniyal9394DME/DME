<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Supabase settings live in config.js, next to this file -->
<script src="config.js"></script>
<title>RIC PGT Registration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maroon letterhead (matches the existing DME dashboard), step rail, one card per step, fixed action bar */
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --sunk:#FBF8F2; --ink:#231A17; --muted:#6E625A; --line:#E2D8C8;
  --brand:#6D1F2B; --brand-deep:#521521; --brand-soft:#F3E4E1; --gold:#B08D57;
  --warn:#8A5A00; --warn-soft:#FBEFD6; --ok:#2F6B45; --ok-soft:#E4F1E7; --err:#A1262F;
  --f-display:"Source Serif 4",Georgia,serif; --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17110F; --surface:#221917; --sunk:#1C1513; --ink:#F1E9E1; --muted:#B3A398; --line:#3A2E2A;
  --brand:#D98A92; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A;
  --warn:#F0C070; --warn-soft:#3A2C12; --ok:#8FD3A5; --ok-soft:#173022; --err:#F08A90; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110F; --surface:#221917; --sunk:#1C1513; --ink:#F1E9E1; --muted:#B3A398; --line:#3A2E2A;
  --brand:#D98A92; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A;
  --warn:#F0C070; --warn-soft:#3A2C12; --ok:#8FD3A5; --ok-soft:#173022; --err:#F08A90; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-deep)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.lh{background:linear-gradient(135deg,#6D1F2B,#521521);color:#fff;border-bottom:3px solid var(--gold)}
header.lh .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.lh img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.lh .t{flex:1;min-width:0}
.lh .inst{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.lh h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,5vw,28px);margin:2px 0 0;line-height:1.15}
.lh .sub{font-size:13px;opacity:.85}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
@media(max-width:480px){.rail button{font-size:11px}}
.rail button{width:100%;border:none;background:none;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;padding:0;text-align:left;display:grid;gap:5px}
.rail button::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.rail button.done::before{background:var(--gold)}
.rail button[aria-current="step"]{color:var(--ink);font-weight:600}
.rail button[aria-current="step"]::before{background:var(--brand)}
main{padding-block:18px 120px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0;line-height:1.2}
.lede{color:var(--muted);margin:-8px 0 0;font-size:15px}
.grid{display:grid;gap:14px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1.4fr .6fr 1fr}}
.grid.three{display:grid;gap:14px}
fieldset.fam{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;display:grid;gap:12px;min-width:0}
fieldset.fam legend{font-weight:600;font-size:14px;padding:0 6px;display:flex;align-items:center}
fieldset.fam .err:empty{display:none}
label.f{display:grid;gap:5px;min-width:0}
label.f>span,.lbl{font-size:14px;font-weight:600}
.req::after{content:" *";color:var(--brand)}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.err{font-size:13px;color:var(--err)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono);letter-spacing:.02em}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.calc{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 18px}
.calc b{font-variant-numeric:tabular-nums}
.note{border-radius:8px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
/* documents */
.docs{display:grid;gap:12px}
@media(min-width:560px){.docs{grid-template-columns:1fr 1fr}}
.doc{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;background:var(--sunk);position:relative}
.doc.has{border-style:solid;border-color:var(--ok);background:var(--surface)}
.doc .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.doc .dh b{font-size:15px}
.doc .prev{height:120px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center;padding:6px}
.doc .prev img{width:100%;height:100%;object-fit:contain}
.doc.photo .prev{width:110px;height:136px;justify-self:center}
.doc.photo .prev img{object-fit:cover}
.doc .meta{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.doc input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.btn{font:600 15px var(--f-body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.btn{display:inline-block}
dl.sum{display:grid;grid-template-columns:minmax(110px,36%) 1fr;gap:6px 14px;margin:0;font-size:15px}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.ref{font-family:var(--f-mono);font-size:20px;background:var(--sunk);border:1px dashed var(--gold);border-radius:8px;padding:10px 14px;display:inline-block}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.bar .saved{flex:1;font-size:13px;color:var(--muted);min-width:0}
</style>

<script>

/* =====================================================================
   BIO DATA FORM (RIC-RWP-HRM-F-04) — shared by the PGT registration
   form and the DME Office app. Builds a filled PDF in the layout of
   the paper form. Needs jsPDF (window.jspdf).
   ===================================================================== */
const BIO_MARITAL=["Single","Married","Divorced","Widowed"];
const BIO_REL=["Father","Mother","Spouse","Son","Daughter","Brother","Sister","Guardian","Other"];
const BIO_JSPDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
function bioLoadPdf(){if(window.jspdf)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement("script");s.src=BIO_JSPDF;s.onload=()=>ok();s.onerror=()=>no(new Error("Could not load the PDF tool. Check the connection."));document.head.append(s)})}
function bioDate(s){if(!s)return"";const d=new Date(s+"T00:00");return isNaN(d)?s:d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).replace(/\//g,"-")}
/* r = {name,father,cnic,domicile,mobile,mobile2,email,bio:{dob,marital,religion,sect,passport,otherNat,resNo,curAddr,permAddr,bank,account,family:[{name,rel,cnic,passport,age,nat}]}}
   photo = data URL (jpeg/png) or null; meta = {ref, at} */
async function bioPdf(r,photo,meta){await bioLoadPdf();const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
 const b=r.bio||{},L=36,R=576,W=R-L,UP=v=>String(v??"").trim().toUpperCase();
 const BLUE=[198,217,241],LINE=[90,90,90];doc.setDrawColor(...LINE);doc.setLineWidth(.6);
 // title
 doc.setFont("times","bold");doc.setFontSize(12.5);const tc=(L+452)/2;
 [["RAWALPINDI INSTITUTE OF CARDIOLOGY",50],["BIO DATA FORM",65]].forEach(([t,y])=>{doc.text(t,tc,y,{align:"center"});const w=doc.getTextWidth(t);doc.line(tc-w/2,y+1.5,tc+w/2,y+1.5)});
 // photo box
 const px=468,py=30,pw=108,ph=128;doc.rect(px,py,pw,ph);
 if(photo){try{const fmt=/^data:image\/png/.test(photo)?"PNG":"JPEG";const ip=doc.getImageProperties(photo);const s=Math.max(pw/ip.width,ph/ip.height);
   // cover-fit inside the box, clipped
   const iw=ip.width*s,ih=ip.height*s;let src=photo;
   if(Math.abs(iw-pw)>1||Math.abs(ih-ph)>1){src=await bioCrop(photo,pw/ph)}
   doc.addImage(src,"JPEG",px+.5,py+.5,pw-1,ph-1);doc.rect(px,py,pw,ph)}catch(e){console.warn(e);photo=null}}
 if(!photo){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text("Picture",px+pw/2,py+50,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(7);
  doc.text(["(With Blue","Background & No","Side Pose)"],px+pw/2,py+62,{align:"center"})}
 // documents
 doc.setFont("times","bold");doc.setFontSize(10);doc.text("Following Documents must attach.",L,95);
 doc.text("1.   CNIC Copy.",L+22,108);doc.text("2.   Passport Copy.",L+22,120);
 // employee information table
 let y=166;const c1=24,c2=168,vx=L+c1+c2;
 const band=(t,yy)=>{doc.setFillColor(...BLUE);doc.rect(L,yy,W,15,"FD");doc.setFont("times","bold");doc.setFontSize(10.5);doc.text(t,L+4,yy+11);
  const w=doc.getTextWidth(t);doc.setFontSize(6.5);doc.text("(IN CAPITAL LETTERS)",L+8+w,yy+10.5)};
 band("Employee Information:",y);y+=15;
 const mob=[r.mobile,r.mobile2].filter(Boolean).join(" / ");
 const rows=[["Name",UP(r.name?"Dr. "+r.name.replace(/^dr\.?\s*/i,""):"")],["Father Name",UP(r.father)],["Date of Birth",bioDate(b.dob)],["Marital Status",UP(b.marital)],["CNIC",r.cnic||""],["Religion",UP(b.religion)],
  ["Domicile",UP(r.domicile)],["Sect",UP(b.sect)],["Passport Number",UP(b.passport||r.passport)],["Mobile No",mob,"(Bio-Metric Verified & Should be on Whatsapp)"],["Other Nationality (If Any)",UP(b.otherNat)],
  ["Residence No/Guardian No",b.resNo||""],["Email Address",String(r.email||"").toLowerCase()],["Current Address",UP(b.curAddr)],["Permanent Address",UP(b.permAddr),"(As per CNIC)"],["Bank Name & Account #",UP([b.bank,b.account].filter(Boolean).join(", A/C ")),"(Salary)"]];
 rows.forEach(([l,v,sub],i)=>{doc.setFont("helvetica","normal");doc.setFontSize(9.5);const lines=doc.splitTextToSize(v||"",R-vx-8);
  const lab=doc.setFont("times","normal").setFontSize(10.5)&&doc.splitTextToSize(l,c2-8);const subl=sub?doc.setFontSize(6.5)&&doc.splitTextToSize(sub,c2-8):[];
  const h=Math.max(17,lines.length*11+6,lab.length*12+subl.length*8+5);
  doc.rect(L,y,c1,h);doc.rect(L+c1,y,c2,h);doc.rect(vx,y,R-vx,h);
  doc.setFont("times","normal");doc.setFontSize(10.5);doc.text(String(i+1),L+c1/2,y+12,{align:"center"});
  doc.text(lab,L+c1+4,y+12);if(sub){doc.setFontSize(6.5);if(l.length<20&&subl.length===1&&doc.getTextWidth(sub)+doc.setFontSize(10.5).getTextWidth(l)<c2-14){const w=doc.getTextWidth(l);doc.setFontSize(6.5);doc.text(sub,L+c1+8+w,y+12)}else{doc.setFontSize(6.5);doc.text(subl,L+c1+4,y+12+lab.length*12-3)}}
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(lines,vx+5,y+12);y+=h});
 // family table
 y+=12;const FC=[["Sr #",30],["Name of Family Member",142],["Relation",62],["CNIC #",92],["Passport #",66],["Age",34],["Other Nationality (if any)",114]];
 doc.rect(L,y,FC[0][1],15);doc.setFillColor(...BLUE);doc.rect(L+FC[0][1],y,W-FC[0][1],15,"FD");doc.setFont("times","bold");doc.setFontSize(10.5);doc.text("Family Information:",L+FC[0][1]+4,y+11);
 {const w=doc.getTextWidth("Family Information:");doc.setFontSize(6.5);doc.text("(IN CAPITAL LETTERS)",L+FC[0][1]+8+w,y+10.5)}y+=15;
 let x=L;doc.setFont("times","bold");doc.setFontSize(9.5);FC.forEach(([t,w])=>{doc.rect(x,y,w,26);const tl=doc.splitTextToSize(t,w-6);doc.text(tl,x+w/2,y+(tl.length>1?10:16),{align:"center"});x+=w});y+=26;
 const fam=(b.family||[]).filter(f=>f&&f.name);const n=Math.max(7,fam.length);
 for(let i=0;i<n;i++){const f=fam[i]||{};const vals=[String(i+1),UP(f.name),UP(f.rel),f.cnic||"",UP(f.passport),f.age?String(f.age):"",UP(f.nat)];
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);const cells=vals.map((v,j)=>doc.splitTextToSize(v,FC[j][1]-6));const h=Math.max(16,...cells.map(c=>c.length*10+5));
  x=L;FC.forEach(([t,w],j)=>{doc.rect(x,y,w,h);doc.setFont(j===0?"times":"helvetica","normal");doc.setFontSize(j===0?10:8.5);doc.text(cells[j],j===0?x+w/2:x+3,y+11,j===0?{align:"center"}:undefined);x+=w});y+=h}
 // undertaking and signature

function v4(){const miss=STEPS.slice(0,LAST).map((s,i)=>stepOk(i)?null:[s,i]).filter(Boolean);const sup=S.sup==="other"?S.supOther+" (not listed)":S.sup;
return`<section class="card"><h2>Check and submit</h2>
${miss.length?`<div class="note warn">Still needed: ${miss.map(([s,i])=>`<button class="btn small" data-go="${i}" style="margin:4px 4px 0 0">${s}</button>`).join("")}</div>`:""}
${FILES.photo?`<img src="${FILES.photo.url}" alt="Your photo" style="width:84px;height:104px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`:""}
<dl class="sum"><dt>Name</dt><dd>Dr. ${esc(S.name)||"—"}</dd><dt>Father's name</dt><dd>${esc(S.father)||"—"}</dd>
<dt>CNIC</dt><dd>${esc(S.cnic)||"—"}</dd><dt>PMDC</dt><dd>${esc(S.pmdc.toUpperCase())||"—"}</dd><dt>Mobile</dt><dd>${esc(S.mobile)||"—"}</dd>
${S.email?`<dt>Email</dt><dd>${esc(S.email)}</dd>`:""}<dt>Domicile</dt><dd>${esc(S.domicile)||"—"}</dd>
<dt>Programme</dt><dd>${esc(S.program)||"—"} · ${esc(S.spec)||"—"}</dd><dt>Supervisor</dt><dd>${esc(sup)||"—"}</dd>
<dt>Training</dt><dd>${S.start?dfmt(new Date(S.start+"T00:00")):"—"}${S.start&&+S.dur?" to "+dfmt(addYears(S.start,+S.dur)):""} (${S.dur||"—"} years)</dd>
<dt>Expected completion</dt><dd>${S.comp?dfmt(new Date(S.comp+"T00:00")):"—"}</dd>
<dt>Posting</dt><dd>${S.duty==="RIC"?"Posted at RIC":S.duty==="Rotation"?`On rotation at ${esc(S.site==="Other"?S.siteOther:(SITES.find(x=>x[0]===S.site)||["",""])[1])}${S.rotStart?" since "+dfmt(new Date(S.rotStart+"T00:00")):""}${S.ret?", returning "+dfmt(new Date(S.ret+"T00:00")):""}`:S.duty==="Frozen"?`Training frozen${S.frozenSince?" since "+dfmt(new Date(S.frozenSince+"T00:00")):""}`:"—"}</dd>
<dt>Date of birth</dt><dd>${S.dob?dfmt(new Date(S.dob+"T00:00")):"—"}</dd><dt>Marital status</dt><dd>${esc(S.marital)||"—"}</dd>
<dt>Religion</dt><dd>${esc(S.religion)||"—"}${S.sect?" ("+esc(S.sect)+")":""}</dd>${S.passport?`<dt>Passport</dt><dd>${esc(S.passport.toUpperCase())}</dd>`:""}${S.otherNat?`<dt>Other nationality</dt><dd>${esc(S.otherNat)}</dd>`:""}
${S.mobile2?`<dt>Second mobile</dt><dd>${esc(S.mobile2)}</dd>`:""}<dt>Residence / guardian no.</dt><dd>${esc(S.resNo)||"—"}</dd>
<dt>Current address</dt><dd>${esc(S.curAddr)||"—"}</dd><dt>Permanent address</dt><dd>${S.sameAddr?"Same as current":esc(S.permAddr)||"—"}</dd>
<dt>Salary account</dt><dd>${esc(S.bank)||"—"}${S.account?", "+esc(S.account):""}</dd>
<dt>Family</dt><dd>${S.family.filter(f=>f.name.trim()).map(f=>esc(f.name)+" ("+esc(f.rel)+(f.age?", "+esc(f.age):"")+")").join("<br>")||"—"}</dd>
<dt>Documents</dt><dd>${docsNeeded().filter(d=>FILES[d.k]).length} of ${docsNeeded().length}</dd></dl>
<label class="check"><input type="checkbox" id="ok" ${S.ok?"checked":""}><span>I hereby undertake that I have read the above information (provided by me) and I will be responsible if it is declared false or fake at any stage. I will inform the DME office of any change in my training, rotation or contact details.</span></label>
<button class="btn primary" data-act="submit" ${miss.length||!S.ok?"disabled":""} style="justify-self:start">Submit registration</button></section>`}

function vDone(){return`<section class="card"><h2>Registration received</h2>
<p class="lede">Thank you, Dr. ${esc(S.name)}. The DME office will verify your details and documents.</p>
<div><span class="hint">${LIVE?"Your RIC PGT ID (confirmed once the DME office verifies your registration)":"Your reference"}</span><br><span class="ref">${esc(S.done.ref)}</span></div>
<span class="hint">Submitted ${esc(S.done.at)}. Keep this reference; quote it if you contact the DME office.</span>
<div class="note ok" style="display:grid;gap:8px"><b>Your bio data form is ready.</b><span>Download it, print it, sign it and hand it to the DME office with your documents. All your details are already filled in.</span>
<button class="btn primary" data-act="biopdf" style="justify-self:start">Download bio data form (PDF)</button><span class="hint" id="bioerr"></span></div>
<ol class="steps"><li>The DME office checks your details against your documents.</li><li>Once verified, you get your RIC PGT number.</li><li>If anything needs correcting, the office will contact you on ${esc(S.mobile)}.</li></ol>
${LIVE?"":`<div class="note warn">Prototype: nothing was sent. In the live version this goes into the DME app's "Pending verification" list.</div>`}
<button class="btn" data-act="reset" style="justify-self:start">Start a new registration</button></section>`}


/* ---------- live: lists from the DME database, submission to Supabase ---------- */
let FORMC=null;const formClosed=()=>FORMC&&(FORMC.open===false||(FORMC.close&&FORMC.close<iso(new Date())));
const SUPA=(window.DME_SUPABASE&&window.DME_SUPABASE.url&&window.DME_SUPABASE.anonKey)?window.DME_SUPABASE:null,LIVE=!!SUPA;let SB=null;
function sbReady(){if(SB)return Promise.resolve(SB);return new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js";s.onload=()=>{SB=window.supabase.createClient(SUPA.url,SUPA.anonKey,{auth:{persistSession:false}});ok(SB)};s.onerror=()=>no(new Error("Could not connect"));document.head.append(s)})}
if(LIVE)sbReady().then(sb=>sb.rpc("dme_public_lists")).then(({data})=>{if(!data)return;
 if((data.specs||[]).length){const sp=data.specs.filter(x=>x.active!==false&&x.teaching!==false&&x.dur&&Object.keys(x.dur).length);if(sp.length){SPECS=sp.map(x=>x.name);DUR=Object.fromEntries(sp.map(x=>[x.name,Object.fromEntries(Object.entries(x.dur).filter(([k,v])=>+v>0).map(([k,v])=>[k,+v]))]))}}
 if((data.faculty||[]).length)SUP=data.faculty.filter(f=>f.c||f.u);
 if((data.sites||[]).length)SITES=[...data.sites.filter(x=>x.active!==false).map(x=>[x.short,x.name]),["Other","Other hospital"]];
 if(data.forms&&data.forms.pgt)FORMC=data.forms.pgt;
 if(!S.done)render()}).catch(()=>{});
async function liveSubmit(b){b.disabled=true;const old=b.textContent;b.textContent="Uploading documents…";
 const fail=m=>{b.disabled=false;b.textContent=old;let el=document.getElementById("suberr");if(!el){el=document.createElement("p");el.id="suberr";el.className="note warn";b.after(el)}el.textContent=m};
 try{const sb=await sbReady();const folder="pgt/"+Date.now()+"-"+Math.random().toString(36).slice(2,8);const docs={};
  for(const d of docsNeeded()){const f=FILES[d.k];if(!f||!f.file)return fail("Attach the "+d.l.toLowerCase()+" again (files are not kept if the page was reloaded).");
   const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${folder}/${d.k}.${ext}`;
   const{error}=await sb.storage.from("dme-uploads").upload(path,f.file,{contentType:f.type||undefined});if(error)return fail("A document could not be uploaded. Check the connection and try again.");docs[d.k]=path}
  b.textContent="Sending…";const p={...S,docs,sup:S.sup==="other"?"":S.sup,supOther:S.sup==="other"?S.supOther:"",bio:bioOf()};delete p.done;delete p.step;delete p.ok;delete p.family;
  const{data,error}=await sb.rpc("dme_submit_pgt",{p});if(error||!data)return fail("Could not send. Check the connection and try again.");
  if(data.error)return fail(data.error==="duplicate"?"A registration with this CNIC already exists. Contact the DME office.":data.error==="closed"?"Online registration has just closed. Contact the DME office.":"Some details are missing or not valid. Check each step.");
  S.done={ref:data.ref,at:new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})};save();render()}catch(e){fail("Could not send. Check the connection and try again.")}}
function bioOf(){return{dob:S.dob,marital:S.marital,religion:S.religion.trim(),sect:S.sect.trim(),passport:S.passport.replace(/\s/g,"").toUpperCase(),otherNat:S.otherNat.trim(),resNo:S.resNo.trim(),
 curAddr:S.curAddr.trim(),permAddr:(S.sameAddr?S.curAddr:S.permAddr).trim(),bank:S.bank.trim(),account:S.account.trim(),family:S.family.filter(f=>f.name.trim()).map(f=>({name:f.name.trim(),rel:f.rel,cnic:f.cnic,passport:f.passport.trim().toUpperCase(),age:f.age===""?"":+f.age,nat:f.nat.trim()}))}}
async function bioDownload(b){const er=document.getElementById("bioerr");b.disabled=true;const t=b.textContent;b.textContent="Preparing…";
 try{const ph=FILES.photo?.file?await bioPhotoData(FILES.photo.file):null;const r={name:S.name,father:S.father,cnic:S.cnic,domicile:S.domicile,mobile:S.mobile,mobile2:S.mobile2,email:S.email,bio:bioOf()};
  const doc=await bioPdf(r,ph,{ref:S.done&&S.done.ref,at:S.done&&S.done.at});doc.save(bioFileName(r));er.textContent=ph?"":"Your photo was not added because the page was reloaded; paste a photo in the box after printing."}
 catch(e){er.textContent=e.message||"Could not make the PDF."}b.disabled=false;b.textContent=t}
const V=[v0,v1c,vFam,v1,v2,v3,v4];
function render(){
 document.getElementById("rail").innerHTML=STEPS.map((s,i)=>`<li><button data-go="${i}" class="${i<S.step&&stepOk(i)?"done":""}" ${i===S.step&&!S.done?'aria-current="step"':""}>${s}</button></li>`).join("");
 if(!S.done&&formClosed()){document.getElementById("app").innerHTML=`<section class="card"><h2>Registration is closed</h2><p class="lede">Online PGT registration is not open at the moment.</p>${FORMC.msg?`<p style="white-space:pre-line;margin:0">${esc(FORMC.msg)}</p>`:""}${FORMC.contact?`<p class="hint">Contact: ${esc(FORMC.contact)}</p>`:""}</section>`;
  document.getElementById("back").disabled=true;document.getElementById("next").hidden=true;return}
 document.getElementById("app").innerHTML=(S.step===0&&!S.done&&FORMC&&FORMC.msg?`<div class="note warn" style="white-space:pre-line;margin-bottom:12px">${esc(FORMC.msg)}</div>`:"")+(S.done?vDone():V[S.step]())+(FORMC&&FORMC.contact&&!S.done?`<p class="hint" style="margin-top:10px">Questions? ${esc(FORMC.contact)}</p>`:"");
 const b=document.getElementById("back"),n=document.getElementById("next");
 b.disabled=S.step===0||!!S.done;n.hidden=S.step===LAST||!!S.done;n.textContent=S.step===DOCSTEP?"Review":"Next";
 window.scrollTo(0,0);
}
const app=document.body;
app.addEventListener("input",e=>{const fm=e.target.dataset.fam;if(fm&&e.target.tagName!=="SELECT"){const[i,f]=fm.split(".");let v=e.target.value;if(f==="cnic"){v=fmtCnic(v);e.target.value=v}if(f==="age"){v=v.replace(/\D/g,"").slice(0,3);e.target.value=v}S.family[+i][f]=v;save();return}
 const k=e.target.dataset.k;if(!k||e.target.tagName==="SELECT")return;let v=e.target.value;
 if(k==="cnic"){v=fmtCnic(v);e.target.value=v}if(k==="mobile"||k==="mobile2"){v=fmtMob(v);e.target.value=v}
 S[k]=v;save();if(touched.has(k)){const er=errOf(k);e.target.setAttribute("aria-invalid",!!er);document.getElementById(k+"-e").textContent=er}});
app.addEventListener("focusout",e=>{const k=e.target.dataset.k;if(!k||!RULES[k])return;touched.add(k);const er=errOf(k);e.target.setAttribute("aria-invalid",!!er);const el=document.getElementById(k+"-e");if(el)el.textContent=er});
app.addEventListener("change",e=>{const t=e.target;
 if(t.id==="ok"){S.ok=t.checked;save();render();return}
 if(t.id==="sameAddr"){S.sameAddr=t.checked;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.fam&&t.tagName==="SELECT"){const[i,f]=t.dataset.fam.split(".");S.family[+i][f]=t.value;save();return}
 if(t.dataset.file){const f=t.files[0],k=t.dataset.file,er=document.getElementById("e-"+k);if(!f)return;
  if(f.size>MAX){er.textContent=`This file is ${(f.size/1048576).toFixed(1)} MB. Use a file under 5 MB.`;return}
  if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)||(k==="photo"&&!f.type.startsWith("image/"))){er.textContent=k==="photo"?"Use a JPG or PNG photo.":"Use an image (JPG, PNG) or a PDF.";return}
  if(FILES[k]?.url)URL.revokeObjectURL(FILES[k].url);
  FILES[k]={file:f,type:f.type,name:f.name,size:f.size,url:f.type.startsWith("image/")?URL.createObjectURL(f):null};const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.k==="start"){S.start=t.value;autoFill();save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.k==="comp"){S.comp=t.value;S.compEdited=true;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 const k=t.dataset.k;if(!k||t.tagName!=="SELECT")return;S[k]=t.value;touched.add(k);
 if(k==="spec"){if(S.program&&!DUR[S.spec]?.[S.program])S.program="";S.sup="";if(S.program)S.dur=String(DUR[S.spec][S.program])}
 if(k==="site"&&S.site!=="Other")S.siteOther="";
 autoFill();
 save();const y=window.scrollY;render();window.scrollTo(0,y)});
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.go!=null){S.step=+b.dataset.go;save();render();return}
 if(b.dataset.prog){S.program=b.dataset.prog;S.sup="";if(S.spec&&DUR[S.spec]?.[S.program])S.dur=String(DUR[S.spec][S.program]);touched.add("program");autoFill();save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.act==="famadd"){S.family.push({name:"",rel:"",cnic:"",passport:"",age:"",nat:""});save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.famdel!=null){S.family.splice(+b.dataset.famdel,1);save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.act==="biopdf")return bioDownload(b);
 if(b.dataset.duty){S.duty=b.dataset.duty;touched.add("duty");save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.act==="submit"){if(LIVE)return liveSubmit(b);S.done={ref:"REG-"+Math.random().toString(16).slice(2,10).toUpperCase(),at:new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})};save();render();return}
 if(b.dataset.act==="reset"){S=blank();for(const k in FILES)delete FILES[k];touched=new Set();save();render()}});
document.getElementById("back").onclick=()=>{if(S.step>0){S.step--;save();render()}};
document.getElementById("next").onclick=()=>{STEPF[S.step].forEach(k=>touched.add(k));if(S.step===FAM)touched.add("family");
 if(!stepOk(S.step)&&S.step<DOCSTEP){render();const f=document.querySelector('[aria-invalid="true"]');if(f){f.focus();f.scrollIntoView({block:"center"})}return}
 S.step++;save();render()};
render();
</script>
