<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIC DME Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Great+Vibes&family=Montserrat:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maroon app bar + horizontal nav; content column; tables scroll inside their own box; side sheet for actions */
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --sunk:#FBF8F2; --ink:#231A17; --muted:#6E625A; --line:#E6DDCF; --line2:#D9CCB8;
  --brand:#6D1F2B; --brand-deep:#521521; --brand-soft:#F3E4E1; --gold:#B08D57; --gold-soft:#F4EBDB;
  --ok:#2F6B45; --ok-soft:#E3F1E6; --warn:#8A5A00; --warn-soft:#FBEFD6; --bad:#A1262F; --bad-soft:#F9E1E2; --info:#2F5D7A; --info-soft:#E3EEF5; --mute-soft:#EFEAE2;
  --f-display:"Source Serif 4",Georgia,serif; --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16110F; --surface:#211917; --sunk:#1B1412; --ink:#F1E9E1; --muted:#B0A096; --line:#352A26; --line2:#46382F;
  --brand:#E0939B; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A; --gold-soft:#33291B;
  --ok:#8FD3A5; --ok-soft:#173022; --warn:#F0C070; --warn-soft:#3A2C12; --bad:#F2959A; --bad-soft:#3D1D20; --info:#8EC1E0; --info-soft:#1B2A35; --mute-soft:#2B2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110F; --surface:#211917; --sunk:#1B1412; --ink:#F1E9E1; --muted:#B0A096; --line:#352A26; --line2:#46382F;
  --brand:#E0939B; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A; --gold-soft:#33291B;
  --ok:#8FD3A5; --ok-soft:#173022; --warn:#F0C070; --warn-soft:#3A2C12; --bad:#F2959A; --bad-soft:#3D1D20; --info:#8EC1E0; --info-soft:#1B2A35; --mute-soft:#2B2320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.appbar{background:linear-gradient(135deg,#6D1F2B,#521521);color:#fff}
.appbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.appbar img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;flex:none}
.appbar .t{flex:1;min-width:0}
.appbar h1{font-family:var(--f-display);font-size:20px;margin:0;font-weight:600;line-height:1.15}
.appbar .s{font-size:12.5px;opacity:.85}
.appbar .user{font-size:13px;text-align:right;opacity:.92;display:none}
@media(min-width:700px){.appbar .user{display:block}}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#5E1A25;border-bottom:3px solid #B08D57}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:#F4E6E3;text-decoration:none;padding:11px 14px;font-size:14px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#fff;font-weight:600}
nav.tabs .cnt{background:#B08D57;color:#2A1A10;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:18px}
.proto{background:var(--gold-soft);border-bottom:1px solid var(--line2);font-size:13px;color:var(--muted)}
.proto .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:6px}
.proto button{margin-left:auto}
main{padding-block:20px 80px;display:grid;gap:18px;min-width:0}
h2{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;line-height:1.2}
h3{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel.flush>h3{padding:14px 16px 0}
.cols{display:grid;gap:18px;grid-template-columns:1fr;min-width:0;align-items:start}
@media(min-width:900px){.cols.two{grid-template-columns:1fr 1fr}.cols.side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
/* KPIs */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;display:grid;gap:2px}
a.kpi:hover{border-color:var(--brand)}
.kpi .n{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.attn{border-color:var(--gold);background:var(--gold-soft)}
/* tables */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;background:var(--sunk);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--brand)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.wrapcell{white-space:normal;min-width:180px}
a{color:var(--brand)}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:14px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:20px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.p-ric{background:var(--ok-soft);color:var(--ok)}
.p-rot{background:var(--info-soft);color:var(--info)}
.p-leave{background:var(--gold-soft);color:var(--warn)}
.p-pause{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-done{background:var(--mute-soft);color:var(--muted)}
.p-pend{background:var(--brand-soft);color:var(--brand)}
.days{font-variant-numeric:tabular-nums;font-weight:600}
.d-red{color:var(--bad)}.d-amb{color:var(--warn)}
/* controls */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input[type=search]{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.85}
.btn{font:600 14px var(--f-body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--brand);padding:2px 4px;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* profile */
.prof{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:76px;height:92px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:600;flex:none;border:1px solid var(--line2)}
.prof .who{flex:1;min-width:220px}
.prof .who h2{font-size:28px}
.prof .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin-top:4px}
dl.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:7px 14px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.masked{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.flag{border-radius:8px;padding:9px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.info{background:var(--info-soft);color:var(--info)}
/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl li{position:relative;padding:0 0 14px 30px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--k,var(--muted))}
.tl .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tl .e{font-weight:600}
.tl .n{font-size:13.5px;color:var(--muted)}
.tl .by{font-size:12px;color:var(--muted)}
.tl .ops{display:inline-flex;gap:2px;margin-left:6px}
.k-exam{--k:var(--ok)}.k-conduct{--k:var(--bad)}.k-status{--k:var(--brand)}.k-leave{--k:var(--gold)}.k-rot{--k:var(--info)}.k-sup{--k:var(--ok)}.k-reg{--k:var(--muted)}
/* docs */
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.docs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.doc{border:1px dashed var(--line2);border-radius:8px;padding:10px;font-size:13px;color:var(--muted);display:grid;gap:6px;text-align:center;min-height:96px;place-content:center}
.doc b{color:var(--ink);font-size:13.5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,8,.45);z-index:40}
.sheet{position:fixed;z-index:41;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{font-size:21px}
.sheet .body{padding:16px;overflow-y:auto;display:grid;gap:14px;align-content:start;flex:1}
.sheet footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;min-width:0}
label.f input,label.f select{width:100%}
label.f .h{font-weight:400;color:var(--muted);font-size:13px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.err{color:var(--bad);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.bar{display:flex;align-items:center;gap:8px;font-size:13.5px}
.bar .track{flex:1;height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.spec-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 34px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.spec-row .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
button.kpi{font:inherit;text-align:left;cursor:pointer}
.formgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:760px){.formgrid{grid-template-columns:1.4fr 1fr 1fr 80px}}
.formgrid3{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:600px){.formgrid3{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.formgrid3{grid-template-columns:1fr 1fr 1fr}}
.formgrid input,.formgrid select,.formgrid3 input,.formgrid3 select{width:100%}
.check2{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.check2 input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.stepper div{font-size:12px;color:var(--muted);display:grid;gap:6px;align-content:start;line-height:1.25;overflow-wrap:anywhere}
.stepper div::before{content:"";height:6px;border-radius:3px;background:var(--line2)}
.stepper .done::before{background:var(--gold)}
.stepper .now{color:var(--ink);font-weight:700}
.stepper .now::before{background:var(--brand)}
.segs{display:inline-flex;gap:2px}
.segs i{width:12px;height:6px;border-radius:2px;background:var(--line2)}
.segs i.on{background:var(--gold)}.segs i.now{background:var(--brand)}
.cal{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.cal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.cal{grid-template-columns:repeat(5,minmax(0,1fr))}}
.month{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:5px;align-content:start;min-height:96px;background:var(--sunk);min-width:0}
.month.now{border-color:var(--brand);background:var(--surface)}
.month h4{margin:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.month.now h4{color:var(--brand)}
.ev{font-size:13px;color:var(--ink);text-decoration:none;line-height:1.3;overflow-wrap:anywhere}
.ev:hover{color:var(--brand)}
.fixture{font-size:12px;color:var(--muted);line-height:1.3}
.kpi .sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.kpi .of{font-size:18px;color:var(--muted)}
.kpi .n.money{font-size:22px;line-height:38px}
.kpis.small{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.kpis.small .n{font-size:24px}
.attnlist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.attnlist li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.attnlist li:last-child a{border-bottom:none}
.attnlist li a:hover b{color:var(--brand)}
.attnlist .go{font-size:13px;color:var(--brand);white-space:nowrap}
.pill.big{font-size:15px;min-width:42px;justify-content:center;line-height:26px}
.pill.big::before{display:none}
.pbar{display:inline-block;width:120px;height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden;vertical-align:middle;margin-right:6px}
.pbar.sm{width:70px;height:6px}
.pbar i{display:block;height:100%;background:var(--ok)}
.tasklist{display:grid;gap:8px}
.task{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.task:hover{border-color:var(--brand)}
.task.late{border-color:var(--bad)}
.task.done b{color:var(--muted);text-decoration:line-through}
.task .tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task .tm{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checklist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.struck{text-decoration:line-through;color:var(--muted)}
input[type=range]{width:100%;padding:0;accent-color:var(--ok)}
.linkbox{flex:1 1 220px;font-family:var(--f-mono);font-size:12.5px}
.qrbox{display:grid;place-items:center;background:#fff;border-radius:8px;padding:10px;border:1px solid var(--line)}
.qrbox svg{width:180px;height:180px}
.qrmiss{font-size:13px;color:#6E625A;padding:20px;text-align:center}
.qrfull{position:fixed;z-index:41;inset:50% auto auto 50%;transform:translate(-50%,-50%);background:#fff;color:#231A17;border-radius:16px;padding:24px;display:grid;gap:10px;justify-items:center;text-align:center;width:min(560px,94vw);max-height:94vh;overflow:auto}
.qrfull h2{color:#231A17}
.qrbig svg{width:min(420px,80vw);height:min(420px,80vw)}
.report h4{margin:8px 0 2px;font-size:14px;color:var(--brand);font-weight:700}
.report p{margin:0}
.report{display:grid;gap:8px}
table.fin td{white-space:normal}
tr.sub td{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:var(--sunk)}
tr.tot td{font-weight:700}
.fbrows{display:grid;gap:6px}
.fbrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.fbrow b{text-align:right;font-variant-numeric:tabular-nums}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--mute-soft)}
.dist i{display:block;height:100%}
.cm{margin:4px 0 0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.cols.three{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--surface)}
.chip:has(input:focus-visible){outline:2px solid var(--brand)}
.fbform{display:grid;gap:16px;max-width:720px}
.fbhead{display:flex;gap:12px;align-items:center}
.fbhead img{width:48px;height:48px;border-radius:50%;background:#fff}
.fbq{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
@media(min-width:620px){.fbq{grid-template-columns:1fr auto;align-items:center}}
.scale{display:flex;gap:6px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0}
.scale span{display:grid;place-items:center;width:42px;height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-weight:600;cursor:pointer}
.scale input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.scale input:focus-visible+span{outline:2px solid var(--brand)}
tr.changed{background:var(--gold-soft)}
details.panel summary{cursor:pointer;padding:14px 16px;list-style-position:inside}
details.panel summary h3{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.subt{font-size:13px;color:var(--muted);line-height:1.35}
.stepper.ex{grid-template-columns:repeat(6,minmax(0,1fr))}
.stepper.or{grid-template-columns:repeat(4,minmax(0,1fr))}
.erow{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center}
.erow input{width:100%}
fieldset.pfsec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:12px;margin:0;min-width:0}
fieldset.pfsec legend{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);padding:0 6px}
fieldset.pfsec textarea,fieldset.pfsec input,fieldset.pfsec select{width:100%}
tr.off td{opacity:.55}
table.prop td{vertical-align:top;white-space:normal}
table.prop td:first-child{width:22%;min-width:150px}
table.prop td:nth-child(2){width:36%;min-width:200px}
table.prop td:last-child{min-width:240px}
table.prop input,table.prop select,table.prop textarea{width:100%}
.fbform{grid-template-columns:minmax(0,1fr)}.fbhead>div{min-width:0}.cols{grid-template-columns:minmax(0,1fr)}
@media(max-width:600px){.fbform .grid2{grid-template-columns:minmax(0,1fr)}}
.appbar .abwrap{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.navbtn{width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:grid;align-content:center;gap:4px;padding:0 10px;cursor:pointer;flex:none}
.navbtn span{display:block;height:2px;border-radius:1px;background:#fff}
.navbtn:hover{background:rgba(255,255,255,.18)}
#userbox{margin-left:auto}
.whobox{display:grid;gap:1px;text-align:right;color:#fff}
.whobox .s{font-size:11.5px;opacity:.8}
.whobox select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);padding:4px 8px;font-weight:600;max-width:220px}
.whobox select option{color:#231A17;background:#fff}
@media(max-width:640px){.hide-sm{display:none}.whobox .s{display:none}.whobox select{max-width:140px}.appbar img{display:none}}
.shell{position:relative}
.sidenav{background:var(--surface);border-right:1px solid var(--line)}
.sidenav nav{display:grid;gap:2px;padding:12px 10px 24px}
.sidenav .ng{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.sidenav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500}
.sidenav a:hover{background:var(--sunk)}
.sidenav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.sidenav .cnt{background:var(--gold);color:#2A1A10;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:18px}
.sidenav .cnt.late{background:var(--bad);color:#fff}
.navscrim{display:none}
@media(min-width:1100px){
 .shell{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start}
 .sidenav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
 body.navcollapsed .shell{grid-template-columns:minmax(0,1fr)}
 body.navcollapsed .sidenav{display:none}
}
@media(max-width:1099px){
 .sidenav{position:fixed;z-index:45;top:0;bottom:0;left:0;width:min(280px,84vw);transform:translateX(-102%);transition:transform .18s ease;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
 body.navopen .sidenav{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
 body.navopen .navscrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(20,10,8,.4)}
}
@media (prefers-reduced-motion:reduce){.sidenav{transition:none}}
.sech{margin:0 0 8px}
.agrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.acard{display:grid;gap:2px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);border-top:3px solid var(--k)}
.acard:hover{border-color:var(--brand)}
.acard .an{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1;color:var(--k)}
.acard .al{font-weight:600;font-size:14px}
.acard .subt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acard.k-bad{--k:var(--bad)}.acard.k-pause{--k:var(--warn)}.acard.k-pend{--k:var(--brand)}.acard.k-rot{--k:var(--info)}.acard.k-done{--k:var(--muted)}
.ogrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.ocard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ocard h3{margin:0}
.ocard header a{font-size:13px;color:var(--brand);white-space:nowrap}
.oc-n{background:var(--mute-soft);color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px;letter-spacing:0;margin-left:4px}
.olist{list-style:none;margin:0;padding:0}
.olist li a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.olist li:first-child a{border-top:none}
.olist li a:hover .m{color:var(--brand)}
.olist .m{display:block;min-width:0;overflow-wrap:anywhere}
.olist .m .subt{display:block}
.olist .r{font-size:13px;white-space:nowrap;text-align:right}
.oempty{margin:0;color:var(--muted);font-size:14px}
.obig{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.spec-row.sm{grid-template-columns:minmax(110px,170px) 1fr 30px;font-size:13.5px;padding:3px 0}
.kpi .money{font-size:22px}
.q{display:grid;gap:6px}
.qt{font-size:15px;font-weight:600}
.qd{margin:-2px 0 2px;font-size:13px;color:var(--muted)}
.otherbox{margin-top:4px}
.scalewrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qcards{display:grid;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.qcard:focus-within{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.qc-top{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(150px,200px);gap:8px;align-items:center}
@media(max-width:600px){.qc-top{grid-template-columns:24px minmax(0,1fr)}.qc-top select{grid-column:2}}
.qc-top input{font-weight:600;font-size:15px}
.qcard textarea,.qcard>input{width:100%}
.qc-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.qc-foot .f.inline{display:flex;align-items:center;gap:6px;font-weight:500}
.qc-foot .f.inline input{width:170px}
.qc-btns{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.formgrid4{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.formgrid4{grid-template-columns:90px 90px 1fr 1fr}}
.formgrid4 input,.formgrid4 select{width:100%}
.cbars{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.cbars li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:13.5px}
.cbar{height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--brand)}
.cbars b{text-align:right;font-variant-numeric:tabular-nums}
.chip{position:relative}
.dgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.dcard{display:grid;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.dcard:hover,.dcard.on{border-color:var(--brand)}
.dcard.on{background:var(--brand-soft)}
.dcard .dn{display:flex;gap:14px;font-size:13.5px;color:var(--muted)}
.dcard .dn em{font-style:normal;font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--ink);margin-right:4px}
.suptable td{vertical-align:top}
.suptable tr.deptrow td{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:14px}
.pchips{display:flex;flex-wrap:wrap;gap:4px;min-width:220px}
.pchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:1px 4px 1px 9px;font-size:12.5px;color:var(--ink);text-decoration:none;background:var(--sunk)}
.pchip:hover{border-color:var(--brand);color:var(--brand)}
.pchip span{font-family:var(--f-mono);font-size:10.5px;background:var(--mute-soft);color:var(--muted);border-radius:999px;padding:0 6px}
.qgrid{display:flex;flex-wrap:wrap;gap:3px}
.qcell{width:30px;height:24px;display:grid;place-items:center;font-size:11px;border-radius:4px;background:var(--mute-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.qcell.q-low{background:var(--bad);color:#fff}.qcell.q-mid{background:var(--gold);color:#2A1A10}.qcell.q-easy{background:var(--ok);color:#fff}
tr.subrow td{font-size:13px;color:var(--muted);background:var(--sunk)}
.qrrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox.sm{padding:6px}.qrbox.sm svg{width:110px;height:110px}
.kpis.small4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media(min-width:700px){.kpis.small4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.kpis.small4 .n{font-size:24px}
/* ===== v9: certificates ===== */
.certcols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1100px){.certcols{grid-template-columns:minmax(0,1fr)}}
.cstage{position:relative;width:100%;aspect-ratio:297/210;overflow:hidden;background:#fffaf0;box-shadow:0 8px 24px rgba(60,20,25,.16);border-radius:2px}
.pv-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sigrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
@media(max-width:600px){.sigrow{grid-template-columns:minmax(0,1fr)}}
tr.selrow td{background:var(--gold-soft)}
p.status{margin:0;font-size:13px;color:var(--muted);min-height:1em}p.status.ok{color:var(--ok)}p.status.warn{color:var(--bad)}
#certhost{position:fixed;left:0;top:0;width:1123px;height:794px;overflow:hidden;z-index:-1;pointer-events:none}#certhost:empty{display:none}
.certov{position:fixed;inset:0;background:rgba(20,10,12,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.certov .card{background:var(--surface);color:var(--ink,#231A17);border-radius:12px;padding:20px;width:min(420px,100%);display:grid;gap:12px}
.certov h3{margin:0}.certov .bar{height:8px;border-radius:8px;background:var(--line2);overflow:hidden}.certov .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b1020,#c9a23a);transition:width .2s}

.cert .csub{font-family:'Cinzel',serif;font-weight:600;font-size:15px;letter-spacing:6px;color:#9a7524;margin-top:2px}
.cert .pres{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:#5c4a45;margin-top:12px}
.cert .name{font-family:'Great Vibes',cursive;font-size:58px;color:#6b1020;line-height:1.15;margin-top:2px;padding:0 30px 2px;border-bottom:2px solid #c9a23a;min-width:520px;max-width:930px;white-space:nowrap;overflow:hidden}
.cert.serif-name .name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:48px;letter-spacing:.5px;line-height:1.2;padding-bottom:4px}
.cert .desc{font-family:'Cormorant Garamond',serif;font-size:19.5px;line-height:1.55;color:#2a1a1a;max-width:800px;margin-top:12px}
.cert .sigs{display:flex;justify-content:space-evenly;gap:40px;margin-top:auto;width:100%;padding:0 10px}
.cert .sig{flex:0 1 290px;min-width:0}
.cert .sig .line{height:2px;background:linear-gradient(90deg,rgba(154,117,36,0),#9a7524 15%,#9a7524 85%,rgba(154,117,36,0));margin-bottom:10px}
.cert .sig .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;color:#2a1a1a}
.cert .sig .ttl{font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:1.6px;color:#6b1020;text-transform:uppercase;margin-top:3px}
/* ===== v9: conditional questions ===== */
.qconds{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-top:1px dashed var(--line2);padding-top:8px}
.qcond{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;width:100%}
.qcond select{max-width:100%}
.q[hidden]{display:none!important}
/* ===== v9: live mode ===== */
body.live .proto{display:none}
body.solo .sidenav,body.solo .navbtn,body.solo .navscrim{display:none!important}
body.solo .shell{display:block}
body.solo main{max-width:760px;margin:0 auto}
.solo-card{max-width:480px;margin:40px auto;display:grid;gap:12px}
.solo-card h2{margin:0}
body.public .solo-card{max-width:760px}
.whobox .live{font-size:11.5px;opacity:.9}
.whobox .live .btn.link{color:#fff;text-decoration:underline;padding:0;min-height:0;font-size:11.5px}
.sy{font-size:11.5px}.sy.bad{color:#ffd2cc;font-weight:700}.sy .btn.link{color:#fff;text-decoration:underline;padding:0;min-height:0;font-size:11.5px}
/* ===== v10: key dates, search ===== */
.kdates{list-style:none;margin:8px 0 0;padding:0 0 6px}
.kdates li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 16px;border-top:1px solid var(--line);font-size:14px}
.kdates li .kd-d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.kdates li .kd-s{font-size:12.5px;color:var(--muted);white-space:nowrap}
.kdates li.done .kd-l{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.kdates li.done .kd-s{color:var(--ok)}
.kdates li.late .kd-s,.kdates li.late .kd-d{color:var(--bad);font-weight:700}
.kdates li.next{background:var(--gold-soft)}.kdates li.next .kd-l{font-weight:600}
@media(max-width:600px){.kdates li{grid-template-columns:76px minmax(0,1fr)}.kdates li .kd-s{grid-column:2}}
.slist{display:grid;padding:6px 0 8px}
.srow{display:grid;gap:2px;padding:9px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.srow:hover{background:var(--gold-soft)}.srow b{font-weight:600}
/* ===== v10: printing a page ===== */
@media print{
 .appbar,.sidenav,.navscrim,.proto,#userbox,.toast,.actions,.toolbar,.chips button:not([aria-pressed="true"]),[data-act],[data-export],.qrrow .toolbar,#overlay{display:none!important}
 body,html{background:#fff!important}.shell{display:block!important}main{max-width:none!important;padding:0!important}
 .panel{box-shadow:none!important;break-inside:avoid;border:1px solid #ccc!important}
 .tblwrap{overflow:visible!important;max-height:none!important}table{font-size:11px}
 a{color:inherit;text-decoration:none}
}
.attsheet table td{height:34px}
@media print{.noprint{display:none!important}.attsheet{border:none!important}}

/* ---------- dates ---------- */
const P=s=>s?new Date(s+"T00:00"):null;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addM=(s,m)=>{const d=P(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d};
const days=(a,b)=>Math.round((a-b)/864e5);
const fd=s=>s?P(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—";
const fdt=s=>new Date(s).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const sess=s=>{const d=P(s);return(d.getMonth()<6?"Jan ":"Jul ")+String(d.getFullYear()).slice(2)};

function cur(p){
 const st=DB.status.filter(s=>s.pid===p.id).map((s,i)=>({...s,i})).sort((a,b)=>(a.date||"9999")<(b.date||"9999")?-1:(a.date||"9999")>(b.date||"9999")?1:a.i-b.i);
 const valid=st.filter(s=>!s.date||s.date<=iso(TODAY));const last=valid[valid.length-1]||{status:"Active"};
 const comp=p.override||(p.start&&p.dur?iso(new Date(addM(p.start,Math.round(p.dur*12))-864e5)):null);
 const rot=DB.rots.filter(r=>r.pid===p.id).sort((a,b)=>a.start<b.start?1:-1)[0];
 const sp=specOf(p.spec),rotational=!!sp?.rotational,rule=sp?.rule||[2,3,.5,1.5,3];
 const rotStart=rotational&&p.start?(rot?.start||(p.program==="FCPS"?p.start:iso(addM(p.start,Math.round(rule[2]*12))))):null;
 const ret=rotational&&p.start?(rot?.ret||iso(addM(p.start,24))):null;
 const lvNow=DB.leaves.find(l=>l.pid===p.id&&P(l.start)<=TODAY&&P(l.end)>=TODAY);
 const lastEnd=DB.leaves.filter(l=>l.pid===p.id&&P(l.end)<TODAY).map(l=>l.end).sort().pop();
 const sup=DB.sups.find(s=>s.pid===p.id&&!s.to);
 const status=last.status,departed=status==="Completed"||isExit(status);
 let phase,pk;
 if(departed){phase=status;pk=status==="Completed"?"done":"bad"}
 else if(status==="Frozen"||status==="Maternity Leave"){phase="Training paused ("+status+")";pk="pause"}
 else if(!p.start){phase="Start date missing";pk="bad"}
 else if(!rotational){phase="At RIC (entire training)";pk="ric"}
 else if(comp&&TODAY>=P(comp)){phase="Past expected completion";pk="bad"}
 else if(TODAY<P(rotStart)){phase="RIC · pre-rotation";pk="ric"}
 else if(TODAY<P(ret)){phase="On rotation";pk="rot"}
 else {phase="RIC · final phase";pk="ric"}
 if(!rotational&&comp&&TODAY>=P(comp)&&!departed&&pk==="ric"){phase="Past expected completion";pk="bad"}
 const atRic=!departed&&pk==="ric"||(!departed&&phase==="Past expected completion");
 const year=p.start?Math.max(1,Math.min(Math.floor(days(TODAY,P(p.start))/365.25)+1,Math.ceil(p.dur||5))):null;
 const recent=lastEnd&&days(TODAY,P(lastEnd))<=DB.settings.leave_recent?lastEnd:null;
 return{status,statusDate:last.date,departed,active:!departed,phase,pk,comp,rotStart,ret,rotSite:pk==="rot"?(rot?.site||"—"):null,rotational,
  leave:lvNow,leaveLeft:lvNow?days(P(lvNow.end),TODAY):null,recentLeave:recent,sup:sup?facById(sup.fid):null,year,
  toRet:ret&&P(ret)>TODAY?days(P(ret),TODAY):null,toComp:comp?Math.max(days(P(comp),TODAY),0):null,body:p.program==="FCPS"?"CPSP":"UHS"}}

/* ---------- checks (replaces Data Quality Flags) ---------- */
function checks(p,c){const f=[];
 if(!p.dur)f.push("Training duration missing");
 if(!p.start)f.push("Training start date missing");
 if(p.reg==="Pending"&&p.declYear&&c.year&&p.declYear!==c.year)f.push(`Declared Year ${p.declYear}, calculated: ${c.year}`);
 if(c.phase==="Past expected completion")f.push("Past expected completion: mark as Completed or set a new completion date");
 if(c.pk==="pause")f.push("Training paused: check the completion date");
 if(!c.sup&&c.active)f.push("No supervisor recorded");
 if(p.notes&&/check|not in faculty/i.test(p.notes))f.push(p.notes.trim());
 return f}

const PHASES=[["active","All active"],["ric","At RIC"],["rot","On rotation"],["leave","On leave"],["pause","Paused"],["done","Completed"],["bad","Left training"],["all","Everyone"]];
function phaseMatch(c,k){if(k==="all")return true;if(k==="active")return c.active;if(k==="leave")return!!c.leave&&c.active;if(k==="done")return c.status==="Completed";if(k==="bad")return isExit(c.status);if(k==="ric")return c.active&&c.pk==="ric";return c.active&&c.pk===k}

function timeline(p){

 DB.leaves.filter(l=>l.pid===p.id).forEach(l=>ev.push({d:l.start,k:"leave",e:`${l.type} leave · ${fd(l.start)} – ${fd(l.end)} (${days(P(l.end),P(l.start))+1} days)`,n:[l.reason,l.notes].filter(Boolean).join(" · "),by:l.by,ref:["leave",l.id]}));
 DB.rots.filter(r=>r.pid===p.id).forEach(r=>ev.push({d:r.start,k:"rot",e:`Rotation at ${(DB.sites.find(s=>s.short===r.site)||{name:r.site}).name}${r.ret?" until "+fd(r.ret):""}`,n:r.notes,by:r.by,ref:["rot",r.id]}));
 DB.sups.filter(s=>s.pid===p.id).forEach(s=>ev.push({d:s.from,k:"sup",e:`Supervisor: ${facName(facById(s.fid))}${s.to?" (until "+fd(s.to)+")":""}`,n:"",by:s.by||""}));
 ev.push(...extraTimeline(p));
 ev.sort((a,b)=>(b.d||"9999")<(a.d||"9999")?-1:(b.d||"9999")>(a.d||"9999")?1:0);
 return`<ul class="tl">${ev.map(e=>`<li class="k-${e.k}"><div class="d">${e.d?fd(e.d):"Date not recorded"}</div><div class="e">${esc(e.e)}${e.ref&&e.ref[0]!=="status"||e.ref&&e.by!=="Import"&&e.by!=="Registration form"?`<span class="ops"><button class="btn link" data-edit="${e.ref[0]}" data-id="${e.ref[1]}">Edit</button><button class="btn link" data-del="${e.ref[0]}" data-id="${e.ref[1]}">Delete</button></span>`:""}</div>${e.n?`<div class="n">${esc(e.n)}</div>`:""}${e.by?`<div class="by">Entered by ${esc(e.by)}</div>`:""}</li>`).join("")}</ul>`}

 ${fl.length?`<div class="flag">${fl.map(esc).join("<br>")}</div>`:""}

 <div class="cols side">

   ${S?fbPanel(w,S):""}
   <div class="panel flush"><h3>History</h3><div class="tblwrap"><table><tbody>${w.log.slice().reverse().map(l=>`<tr><td class="code">${fdt(l.at)}</td><td class="wrapcell">${esc(l.what)}</td><td>${esc(l.by)}</td></tr>`).join("")||`<tr><td class="empty">No activity yet.</td></tr>`}</tbody></table></div></div>

function bars(dist){const t=dist.reduce((a,b)=>a+b,0)||1;const C=["var(--bad)","#C8794B","var(--gold)","#7FA37A","var(--ok)"];return`<span class="dist" title="${dist.map((n,i)=>`${i+1}: ${n}`).join(", ")}">${dist.map((n,i)=>n?`<i style="width:${n/t*100}%;background:${C[i]}"></i>`:"").join("")}</span>`}
function qrOverlay(w){document.getElementById("overlay").innerHTML=`<div class="scrim" data-act="close"></div><div class="qrfull" role="dialog" aria-modal="true" aria-label="Feedback QR code"><div class="code">Scan to give feedback</div><h2>${esc(w.title)}</h2><div class="qrbig">${qrSvg(fbLink(w),10)}</div><div class="code" style="font-size:14px">${fbLink(w)}</div><button class="btn" data-act="close">Close</button></div>`}

function sheetWs(w){const n=!w;w=w||{title:"",dept:"Cardiac Surgery",focal:"",director:"",month:mAdd(`${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,"0")}`,1),date:"",venue:"",format:"",notes:""};
 openSheet(n?"Add workshop":"Edit workshop",`
 <label class="f">Title<input name="title" value="${esc(w.title)}"></label>
 <label class="f">Lead department<select name="dept">${opt(wsDepts(),w.dept)}</select></label>
 <datalist id="ws-fac">${DB.faculty.map(f=>`<option value="${esc(facName(f))}">`).join("")}</datalist>
 <div class="grid2"><label class="f">Focal person<input name="focal" list="ws-fac" value="${esc(w.focal)}"></label><label class="f">Course director <span class="h">receives the director's share</span><input name="director" list="ws-fac" value="${esc(w.director||"")}" placeholder="Same as focal person"></label></div>
 <div class="grid2"><label class="f">Month<input type="month" name="month" value="${w.month}"></label><label class="f">Date <span class="h">if fixed</span><input type="date" name="date" value="${w.date||""}"></label></div>
 <div class="grid2"><label class="f">Venue<select name="venue">${opt([["","Not set"],...VENUES],w.venue)}</select></label><label class="f">Format<select name="format">${opt([["","Not set"],...FORMATS],w.format)}</select></label></div>
 <label class="f">Notes<textarea name="notes">${esc(w.notes)}</textarea></label>`,()=>{
 if(fv("title").length<3)return fail("Enter the workshop title.");if(!fv("month"))return fail("Choose the month.");const d=fv("date");if(d&&!d.startsWith(fv("month")))return fail("The date is not in the chosen month.");
 const rec={title:fv("title"),dept:fv("dept"),focal:fv("focal"),director:fv("director")||fv("focal"),month:fv("month"),date:d||null,venue:fv("venue"),format:fv("format"),notes:fv("notes")};
 if(n){const nw=blankWs({id:uid("W"),...rec});DB.workshops.push(nw);wlog(nw,"Workshop added to the calendar");go("ws-"+nw.id)}
 else{const ch=rec.month!==w.month?` (moved to ${mLabel(rec.month)})`:"";Object.assign(w,rec);delete w.placeholder;wlog(w,"Details edited"+ch)}toast("Saved");return true})}
function wsAction(a,b){
 if(a==="ws-resched"){UI.resched=true;UI.pend={};render();return}
 if(a==="ws-rcancel"){UI.resched=false;UI.pend={};render();return}
 if(a==="ws-rsave"){let n=0;for(const[id,p] of Object.entries(UI.pend)){const w=DB.workshops.find(x=>x.id===id);const nd=p.date===undefined?w.date:p.date;if(p.month!==w.month||(nd??null)!==(w.date??null)){const from=mLabel(w.month);w.month=p.month;w.date=nd&&nd.startsWith(p.month)?nd:null;delete w.placeholder;wlog(w,`Rescheduled from ${from} to ${mLabel(w.month)}${w.date?" ("+fd(w.date)+")":""}`);n++}}
  UI.resched=false;UI.pend={};persist();toast(`${n} workshop${n===1?"":"s"} rescheduled`);render();return}
 const w=DB.workshops.find(x=>x.id===route.id);if(!w)return;
 const step=(s,what)=>{w.stage=s;wlog(w,what);persist();render()};
 if(a==="ws-copy")return copyText(document.getElementById("copysrc").value,b);
 if(a==="ws-copyfb")return copyText(fbLink(w),b);
 if(a==="ws-copyrep")return copyText(document.getElementById("repsrc").value,b);
 if(a==="ws-fbtoggle"){w.fbOpen=!w.fbOpen;wlog(w,w.fbOpen?"Feedback form opened":"Feedback form closed");persist();render();return}
 if(a==="ws-qrbig")return qrOverlay(w);
 if(a==="ws-fee")return sheetFee(w);
 if(a==="ws-sent")return step(1,"Proposal link sent to "+(w.focal||"focal person"));
 if(a==="ws-recv")return step(2,"Proposal F-06 received");
 if(a==="ws-back"){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to confirm";return}return step(w.stage-1,`Moved back to "${STAGES[w.stage-1]}"`)}
 if(a==="ws-del"){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}
  DB.workshops=DB.workshops.filter(x=>x!==w);log(`Deleted workshop ${w.title} (${mLabel(w.month)})`);toast("Workshop deleted");go("workshops");return}
 if(a==="ws-edit")return sheetWs(w);
 if(a==="ws-approve")return openSheet("Approve proposal",`
  <label class="f">Workshop date<input type="date" name="date" value="${w.date||w.month+"-15"}"></label>
  <div class="grid2"><label class="f">Venue<select name="venue">${opt(VENUES,w.venue||"Auditorium")}</select></label><label class="f">Seats<input type="number" min="1" name="seats" value="${w.seats||30}"></label></div>
  <label class="f">Registration fee (PKR) <span class="h">0 for free</span><input type="number" min="0" step="100" name="fee" value="${w.fee??0}"></label>
  <label class="f">Course director <span class="h">receives ${DB.settings.director_share??60}% of net income</span><input name="director" list="ws-fac2" value="${esc(w.director||w.focal)}"><datalist id="ws-fac2">${DB.faculty.map(f=>`<option value="${esc(facName(f))}">`).join("")}</datalist></label>
  <div class="flag info">Fees are charged only where the Office of the Executive Director and the Medical Education Department agree.</div>

const QTYPES=[["short","Short answer"],["para","Paragraph"],["mc","Multiple choice"],["cb","Checkboxes"],["dd","Dropdown"],["scale","Linear scale"],["num","Number"],["date","Date"],["time","Time"],["list","List, one per line"]];

const OPT_TOKENS={"@depts":["All departments",()=>wsDepts()],"@faculty":["All faculty names",()=>DB.faculty.map(facName)],"@workshops":["All workshop titles",()=>[...new Set(DB.workshops.filter(w=>!w.example).map(w=>w.title))]]};
const qOpts=q=>(q.opts||[]).flatMap(o=>OPT_TOKENS[o]?OPT_TOKENS[o][1]():[o]);
const Q=(k,t,type,o={})=>({k,t,type,d:"",req:false,opts:[],other:false,min:1,max:5,minL:"",maxL:"",section:"",...o});
const qEmpty=v=>v==null||v===""||(Array.isArray(v)&&!v.length);
const isOther=v=>typeof v==="string"&&v.startsWith("Other");
function qCtrl(q,v,name,dis){const d=dis?"disabled":"";const O=qOpts(q);
 const otherTxt=Array.isArray(v)?(v.find(isOther)||""):isOther(v)?v:"";const ot=otherTxt.replace(/^Other:?\s*/,"");
 const otherBox=q.other?`<input class="otherbox" name="${name}-other" value="${esc(ot)}" placeholder="Other (please specify)" ${d} aria-label="Other, please specify">`:"";
 switch(q.type){
  case"para":return`<textarea name="${name}" ${d}>${esc(v||"")}</textarea>`;
  case"list":return`<textarea name="${name}" rows="4" ${d}>${esc(Array.isArray(v)?v.join("\n"):v||"")}</textarea>`;
  case"num":return`<input type="number" name="${name}" value="${esc(v??"")}" ${d}>`;
  case"date":return`<input type="date" name="${name}" value="${esc(v||"")}" ${d}>`;
  case"time":return`<input type="time" name="${name}" value="${esc(v||"")}" ${d}>`;
  case"dd":return`<select name="${name}" ${d}><option value="">Choose</option>${O.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}${q.other?`<option value="__other" ${isOther(v)?"selected":""}>Other</option>`:""}</select>${otherBox}`;
  case"mc":return`<div class="chips">${O.map(o=>`<label class="chip"><input type="radio" class="sr" name="${name}" value="${esc(o)}" ${v===o?"checked":""} ${d}> ${esc(o)}</label>`).join("")}${q.other?`<label class="chip"><input type="radio" class="sr" name="${name}" value="__other" ${isOther(v)?"checked":""} ${d}> Other</label>`:""}</div>${otherBox}`;
  case"cb":{const arr=Array.isArray(v)?v:[];return`<div class="chips">${O.map(o=>`<label class="chip"><input type="checkbox" class="sr" name="${name}" value="${esc(o)}" ${arr.includes(o)?"checked":""} ${d}> ${esc(o)}</label>`).join("")}${q.other?`<label class="chip"><input type="checkbox" class="sr" name="${name}" value="__other" ${arr.some(isOther)?"checked":""} ${d}> Other</label>`:""}</div>${otherBox}`}
  case"scale":{const n=[];for(let i=+q.min;i<=+q.max;i++)n.push(i);return`<div class="scalewrap">${q.minL?`<span class="subt">${esc(q.minL)}</span>`:""}<div class="scale" role="radiogroup" aria-label="${esc(q.t)}">${n.map(i=>`<label><input type="radio" name="${name}" value="${i}" ${+v===i?"checked":""} ${d}><span>${i}</span></label>`).join("")}</div>${q.maxL?`<span class="subt">${esc(q.maxL)}</span>`:""}</div>`}
  default:{const dl=(q.opts||[]).find(o=>OPT_TOKENS[o]);return`<input name="${name}" value="${esc(v||"")}" ${dl?`list="dl-${name}"`:""} ${d}>${dl?`<datalist id="dl-${name}">${qOpts(q).map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`}}}
function qRead(root,q,name){const el=root.querySelector(`[name="${name}"]`);const oth=()=>{const t=(root.querySelector(`[name="${name}-other"]`)?.value||"").trim();return t?"Other: "+t:"Other"};

  case"list":return(el?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  case"num":{const v=(el?.value||"").trim();return v===""?"":+v}
  case"mc":case"scale":{const c=root.querySelector(`[name="${name}"]:checked`);if(!c)return"";if(q.type==="scale")return+c.value;return c.value==="__other"?oth():c.value}
  case"dd":return el?.value==="__other"?oth():(el?.value||"");
  case"cb":return[...root.querySelectorAll(`[name="${name}"]:checked`)].map(c=>c.value==="__other"?oth():c.value);
  default:return(el?.value||"").trim()}}
const qText=(q,v)=>qEmpty(v)?"":Array.isArray(v)?v.join("; "):String(v);
const qShow=(q,v)=>{if(qEmpty(v))return'<span class="subt">—</span>';if(q.type==="list")return`<ul class="cm">${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;if(q.type==="cb")return v.map(x=>`<span class="pill p-done" style="margin:2px 4px 2px 0">${esc(x)}</span>`).join("");if(q.type==="date")return fd(v);if(q.type==="scale")return`${v} / ${q.max}`;return esc(v)};

 L.push(`WORKSHOP REPORT: ${w.title.toUpperCase()}`,`Rawalpindi Institute of Cardiology · Department of Medical Education`,``,`1. DETAILS`,`Date: ${fd(w.date)}   Venue: ${w.venue||"RIC"}   Format: ${w.format||"—"}`,`Lead department: ${w.dept}`,`Focal person: ${w.focal||"—"}   Course director: ${w.director||w.focal||"—"}`,``,

 if(S){L.push(`${S.n} responses (${S.rate??"—"}% of attendees). Overall ${f1(S.overall)}/5${S.rec!=null?`; ${S.rec}% would recommend`:""}.`);if(S.pre!=null&&S.post!=null)L.push(`Self-rated confidence: ${f1(S.pre)} before, ${f1(S.post)} after.`);

  S.qs.filter(x=>x.counts&&x.n&&x.q.k!=="rec").forEach(x=>L.push(`${x.q.t}: ${x.counts.slice(0,3).map(([k,n])=>`${k} (${n})`).join(", ")}`));
  S.qs.filter(x=>x.texts&&x.n).forEach(x=>L.push(`${x.q.t}: ${x.texts.slice(0,3).map(t=>t[0]).join("; ")}`))}
 else L.push("No feedback recorded.");
 L.push(``,`4. FINANCIAL STATEMENT (PKR)`,`Income`,`  Registration fees${w.feeCollected!=null?" (amount collected)":w.fee?` (${w.reg.paid} × ${(+w.fee).toLocaleString()})`:" (free workshop)"}: ${F.fees.toLocaleString()}`);
 (w.incomes||[]).forEach(x=>L.push(`  ${x.source}${x.note?" ("+x.note+")":""}: ${(+x.amount).toLocaleString()}`));L.push(`  Total income: ${F.totalIn.toLocaleString()}`,`Expenses`);

 return L.join("\n")}

/* ---------- Evalbee result file ---------- */
const nameKey=s=>String(s||"").toLowerCase().replace(/^\s*(dr|prof)\.?\s*/,"").replace(/[^a-z]/g,"");
function parseEvalbee(aoa){const h=(aoa[0]||[]).map(v=>String(v??"").trim());const ix=k=>h.indexOf(k);
 const need=["Roll No","Name","Total Marks"];const miss=need.filter(k=>ix(k)<0);if(miss.length)throw new Error("This is not an Evalbee result file. Missing columns: "+miss.join(", "));
 const qn=[];h.forEach((c,i)=>{const m=c.match(/^Q (\d+) Options$/);if(m)qn.push({n:+m[1],o:i,k:h.indexOf(`Q ${m[1]} Key`),m:h.indexOf(`Q ${m[1]} Marks`)})});
 const num=v=>v===null||v===undefined||v===""?null:+v;
 return aoa.slice(1).filter(r=>r&&r[ix("Name")]).map(r=>({exam:r[ix("Exam")]||"",cls:r[ix("Class")]||"",roll:String(r[ix("Roll No")]??"").trim(),name:String(r[ix("Name")]).trim(),total:num(r[ix("Total Marks")]),grade:r[ix("Grade")]||"",
  correct:num(r[ix("Correct Answers")]),incorrect:num(r[ix("Incorrect Answers")]),na:num(r[ix("Not attempted")]),ans:qn.map(q=>r[q.o]??null),key:qn.map(q=>r[q.k]??null),qm:qn.map(q=>num(r[q.m]))}))}
function matchRow(x,row,pool){const r=row.roll.replace(/^0+/,"");let p=pool.find(p=>(x.roll?.[p.id]&&x.roll[p.id].replace(/^0+/,"")===r)||rollOf(p)===row.roll);
 if(p)return[p,"Roll number"];const nk=nameKey(row.name);p=pool.find(p=>nameKey(p.name)===nk);if(p)return[p,"Name"];
 const c=pool.filter(p=>nameKey(p.name).startsWith(nk)||nk.startsWith(nameKey(p.name)));return c.length===1?[c[0],"Similar name"]:[null,""]}
function applyImport(x,rows,file,map){x.detail=x.detail||{};x.items=x.items||{};x.uploads=x.uploads||[];x.added=x.added||[];let saved=0,abs=0;const paper=rows[0]?.exam||file;
 const keyRow=rows.find(r=>r.total!=null)||rows[0];const max=keyRow?keyRow.key.filter(k=>k).length:0;
 rows.forEach((row,i)=>{const pid=map[i];if(!pid)return;const p=DB.pgts.find(q=>q.id===pid);
  if(x.cands&&!x.cands.includes(pid))x.cands.push(pid);else if(!x.cands&&!exCands(x).includes(p))x.added.push(pid);
  if(row.total==null){x.absent[pid]=true;delete x.marks[pid];abs++}else{delete x.absent[pid];x.marks[pid]=max?Math.round(row.total/max*1000)/10:row.total;saved++}
  x.detail[pid]={paper,total:row.total,max,correct:row.correct,incorrect:row.incorrect,na:row.na,grade:row.grade,roll:row.roll,file};
  if(!x.roll)x.roll={};if(!x.roll[pid])x.roll[pid]=row.roll});
 const sat=rows.filter(r=>r.total!=null);if(keyRow&&sat.length){const k=keyRow.key;x.items[paper]={spec:specOfCls(rows[0].cls),file,n:sat.length,key:k,correct:k.map((_,q)=>sat.filter(r=>r.qm[q]>0).length),blank:k.map((_,q)=>sat.filter(r=>r.ans[q]==null).length),multi:k.map((_,q)=>sat.filter(r=>String(r.ans[q]||"").includes(",")).length)}}
 x.uploads.push({file,paper,at:new Date().toISOString(),by:ME,rows:rows.length,saved,abs,skipped:rows.length-saved-abs});
 xlog(x,`Evalbee results uploaded (${paper}): ${saved} marks, ${abs} absent${rows.length-saved-abs?`, ${rows.length-saved-abs} not matched`:""}`);if(x.stage<3)x.stage=3}
function specOfCls(c){const k=nameKey(c);return(DB.specs.find(s=>nameKey(s.name)===k)||DB.specs.find(s=>k.includes(nameKey(s.name))||nameKey(s.name).includes(k))||{}).name||c}

async function readImport(file){try{if(!window.XLSX)throw new Error("The Excel library did not load. Check the connection and reload.");const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});
 const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:null});const rows=parseEvalbee(aoa);if(!rows.length)throw new Error("No candidate rows found in the file.");
 const x=DB.exams.find(e=>e.id===route.id),spec=specOfCls(rows[0].cls),pool=verified().slice().sort((a,b)=>(b.spec===spec)-(a.spec===spec));
 const map={},how={};rows.forEach((r,i)=>{const[p,h]=matchRow(x,r,pool);map[i]=p?.id||"";how[i]=h});UI.imp={file:file.name,rows,map,how,spec};render()}catch(e){toast(e.message||"Could not read the file")}}

  <p class="subt" style="margin:0">Upload the result file downloaded from Evalbee, one specialty or year paper at a time. Rows are matched by roll number, then by name; you can fix any match before saving. Blank marks are recorded as absent.</p>

function certData(kind,o,p,serial){const C=certOf(o);return{name:certName(p.name),serial:serial||p.iss?.serial||nextSerial(C,0),t:certTpl(C,p.group),vals:certVals(kind,o,p),sigs:certSigs(C),nameStyle:DB.certCfg.nameStyle}}
function nextSerial(C,k){const used=C.issued.map(x=>+String(x.serial).slice(C.prefix.length)||0);const n=(used.length?Math.max(...used):0)+1+k;return C.prefix+String(n).padStart(3,"0")}

/* ---------- generation ---------- */
const CERT_LIBS=["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"];
let certLibP=null;
function certLibs(){if(!certLibP)certLibP=Promise.all(CERT_LIBS.map(src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.append(s)}))).catch(e=>{certLibP=null;throw e});return certLibP}
let certCancel=false;
function certProgress(t,k,n){let ov=document.getElementById("certov");if(!ov){ov=document.createElement("div");ov.id="certov";ov.className="certov";ov.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Making certificates"><h3>Making certificates</h3><div class="bar"><i></i></div><p class="subt"></p><button class="btn small" data-act="cf-cancel">Cancel</button></div>`;document.body.append(ov)}
 ov.querySelector("i").style.width=Math.round(k/Math.max(n,1)*100)+"%";ov.querySelector("p").textContent=t}
const certProgressEnd=()=>document.getElementById("certov")?.remove();
async function certGenerate(mode){const kind=route.v==="cert"?"ws":"ex",o=kind==="ws"?DB.workshops.find(x=>x.id===route.id):DB.exams.find(x=>x.id===route.id);const C=certOf(o);
 const L=kind==="ws"?wsCertPeople(o):examMerit(o);const off=new Set(C.off);let list=mode==="cur"?L.filter(p=>p.key===UI.ccur):L.filter(p=>!off.has(p.key));if(!list.length)return;
 const st=document.getElementById("cf-status");const say=(m,k)=>{if(st){st.textContent=m;st.className="status"+(k?" "+k:"")}};
 if(!DL){say("Downloads are not available in this view.","warn");return}
 certCancel=false;certProgress("Loading the PDF tools…",0,1);
 try{await certLibs()}catch(e){certProgressEnd();say("The PDF tools did not load. Check the internet connection and try again.","warn");return}
 try{await Promise.all(["700 26px Cinzel","italic 500 21px 'Cormorant Garamond'","700 19px 'Cormorant Garamond'","58px 'Great Vibes'","600 12px Montserrat"].map(f=>document.fonts.load(f)))}catch(e){}
 /* serials: keep issued ones, give the next numbers to new people in list order */
 let k=0;const plan=list.map(p=>({p,serial:p.iss?p.iss.serial:nextSerial(C,k++)}));
 const scale=(DB.certCfg.quality==="std"?150:300)/96,host=document.getElementById("certhost");const{jsPDF}=window.jspdf;
 const newPdf=()=>new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
 const pageOf=async(it)=>{host.innerHTML=certArt(certData(kind,o,it.p,it.serial));const c=host.querySelector(".cert");c.style.transform="none";certFit(c);
  const cv=await html2canvas(c,{scale,backgroundColor:"#fffaf0",logging:false,x:0,y:0,scrollX:0,scrollY:0,windowWidth:1200,windowHeight:900,width:1123,height:794});host.innerHTML="";return cv.toDataURL("image/jpeg",DB.certCfg.quality==="std"?.92:.95)};
 let blob,fname;const base=(kind==="ws"?o.title:`${o.title} ${o.session} merit`).replace(/[\\\/:*?"<>|]+/g,"-");const safe=s=>s.replace(/[\\\/:*?"<>|]+/g,"-").slice(0,120);
 try{
  if(mode==="zip"){const zip=new JSZip();for(let i=0;i<plan.length;i++){if(certCancel)throw"cancel";certProgress(`${i+1} of ${plan.length} · ${certName(plan[i].p.name)}`,i,plan.length);const pdf=newPdf();pdf.addImage(await pageOf(plan[i]),"JPEG",0,0,297,210,undefined,"NONE");zip.file(safe(plan[i].serial+" - "+certName(plan[i].p.name))+".pdf",pdf.output("arraybuffer"))}
   certProgress("Compressing…",1,1);blob=await zip.generateAsync({type:"blob"});fname=`Certificates ${base}.zip`}
  else{const pdf=newPdf();for(let i=0;i<plan.length;i++){if(certCancel)throw"cancel";certProgress(`${i+1} of ${plan.length} · ${certName(plan[i].p.name)}`,i,plan.length);if(i)pdf.addPage("a4","landscape");pdf.addImage(await pageOf(plan[i]),"JPEG",0,0,297,210,undefined,"NONE")}
   certProgress("Building the PDF…",1,1);blob=pdf.output("blob");fname=mode==="cur"?safe(plan[0].serial+" - "+certName(plan[0].p.name))+".pdf":`Certificates ${base}.pdf`}
 }catch(e){certProgressEnd();host.innerHTML="";say(e==="cancel"?"Cancelled. Nothing was saved and no serial numbers were used.":"Something went wrong while drawing the certificates: "+(e.message||e),"warn");return}
 certProgressEnd();
 try{await DL.save({filename:fname,data:blob})}catch(e){say(e?.code==="declined"?"Download cancelled. No serial numbers were used.":e?.code==="too_large"?"The file is too large to save here. Choose Standard quality or Separate PDFs.":"The file could not be saved in this view.","warn");return}
 const at=new Date().toISOString(),fresh=plan.filter(it=>!it.p.iss);
 fresh.forEach(it=>C.issued.push({key:it.p.key,serial:it.serial,name:certName(it.p.name),group:it.p.group,role:it.p.role||"",at,by:ME,date:C.issueDate,...(kind==="ex"?{pid:it.p.pid,marks:it.p.marks,spec:it.p.spec,year:it.p.year}:{})}));
 if(kind==="ws"){o.certs=C.issued.filter(x=>x.group==="participant").length;wlog(o,`Certificates made: ${plan.length}${fresh.length?`, ${fresh.length} new serial numbers (${fresh[0].serial}${fresh.length>1?" to "+fresh[fresh.length-1].serial:""})`:" (reprint)"}`)}
 else xlog(o,`Merit certificates made: ${plan.length}${fresh.length?`, ${fresh.length} new serial numbers`:" (reprint)"}`);
 log(`${plan.length} certificate${plan.length>1?"s":""} made for ${kind==="ws"?o.title:o.title+" "+o.session}`,(kind==="ws"?"ws-":"exam-")+o.id);
 persist();render();const s2=document.getElementById("cf-status");if(s2){s2.textContent=`${plan.length} certificate${plan.length>1?"s":""} saved${fresh.length?`; ${fresh.length} new serial number${fresh.length>1?"s":""} recorded in the register`:""}.`;s2.className="status ok"}}

EXPORTS.certreg=(kind,id)=>{const o=kind==="ws"?DB.workshops.find(x=>x.id===id):DB.exams.find(x=>x.id===id);const C=certOf(o);
 return{file:`Certificate register ${kind==="ws"?o.title:o.title+" "+o.session}`,sheets:[sheetFrom("Register",C.issued.map((z,i)=>({"S. No":i+1,"Serial No":z.serial,"Name":z.name,"Certificate":CERT_GRP[z.group],"Role / position":z.role,...(kind==="ex"?{"Specialty":z.spec||"","Year at RIC":z.year?"RIC year "+z.year:"","Marks %":z.marks??""}:{}),"Date of issue":z.date||"","Made on":z.at.slice(0,10),"Made by":z.by})))]}};

 DB.exams.forEach(x=>(x.cert?.issued||[]).forEach(z=>rows.push({"Serial No":z.serial,"Name":z.name,"Certificate":"Merit","Role / position":z.role+(z.spec?` · ${z.spec}${z.year?" · RIC year "+z.year:""}`:""),"Programme":`${x.title} ${x.session}`,"Held on":x.date||"","Date of issue":z.date||"","Made by":z.by})));
 rows.sort((a,b)=>a["Serial No"]<b["Serial No"]?-1:1);return{file:`RIC DME certificate register ${iso(TODAY)}`,sheets:[sheetFrom("All certificates",rows)]}};

function certObj(){return route.v==="cert"?DB.workshops.find(x=>x.id===route.id):route.v==="certx"?DB.exams.find(x=>x.id===route.id):null}
function certList(){const o=certObj();return route.v==="cert"?wsCertPeople(o):examMerit(o)}

 const tr=e.target.closest("tr[data-cfpv]");if(tr&&!e.target.closest("input,button")){UI.ccur=tr.dataset.cfpv;render();return}
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.cg){UI.cg=d.cg;UI.ccur=null;render();return}

 if(a==="cf-add"){const g=pick("cf-ag"),r=pick("cf-ar")||{participant:"Participant",faculty:"Facilitator",organiser:"Organiser"}[g];const names=(document.getElementById("cf-an").value||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){toast("Type at least one name, or choose an Excel file");return}names.forEach(n=>{if(!C.extra.some(x=>certKey(x.group,x.name)===certKey(g,n)))C.extra.push({name:n,group:g,role:r})});
  (route.v==="cert"?wlog:xlog)(o,`${names.length} added to certificates (${CERT_GRP[g]})`);persist();UI.cg=g;render();toast(`${names.length} added`);return}
 if(a==="cf-gen"){C.issueDate=pick("cf-date")||C.issueDate;certGenerate(d.mode);return}
 if(a==="cf-cancel"){certCancel=true;return}});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="cf-cancel"]');if(b)certCancel=true});
document.addEventListener("change",e=>{if(route.v!=="cert"&&route.v!=="certx")return;const t=e.target,d=t.dataset,o=certObj();if(!o)return;const C=certOf(o);
 if(d.cfk){const s=new Set(C.off);if(t.checked)s.delete(d.cfk);else s.add(d.cfk);C.off=[...s];persist();render();return}
 if(d.cfall){const L=certList().filter(p=>UI.cg==="all"||p.group===UI.cg),s=new Set(C.off);L.forEach(p=>t.checked?s.delete(p.key):s.add(p.key));C.off=[...s];persist();render();return}
 if(d.cft){const g=d.g;C.tpl[g]={...certTpl(C,g),[d.cft]:t.value};persist();render();return}
 if(d.cfs){if(!C.sigs)C.sigs=JSON.parse(JSON.stringify(DB.certCfg.sigs));const s=C.sigs[+d.i];if(d.cfs==="on")s.on=t.checked;else s[d.cfs]=t.value.trim();persist();render();return}
 if(t.id==="cf-ns"){DB.certCfg.nameStyle=t.value;persist();render();return}
 if(t.id==="cf-nc"){DB.certCfg.nameCase=t.value;persist();render();return}
 if(t.id==="cf-q"){DB.certCfg.quality=t.value;persist();return}

 if(t.id==="cx-top"){C.top=+t.value;persist();render();return}
 if(t.id==="cx-by"){C.by=t.value;persist();render();return}

 if(t.id==="cf-xl"&&t.files[0]){const f=t.files[0];t.value="";const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:false,blankrows:false});
  const h=(aoa[0]||[]).map(x=>String(x).trim().toLowerCase());let ni=h.findIndex(x=>/name/.test(x)),ri=h.findIndex(x=>/role|designation/.test(x));const body=ni<0?aoa:aoa.slice(1);if(ni<0)ni=0;
  const g=pick("cf-ag"),r0=pick("cf-ar")||{participant:"Participant",faculty:"Facilitator",organiser:"Organiser"}[g];let n=0;

/* ---------- rows ⇄ DB ---------- */
function dbRows(){const out=[];Object.keys(DB).forEach(k=>{const v=DB[k];
 if(ARR_COLLS.includes(k)){(v||[]).forEach((x,i)=>{if(!x.id)x.id=uid(k==="audit"?"A":"X");out.push({coll:k,id:String(x.id),ord:k==="audit"?0:i,data:x})})}
 else out.push({coll:"meta",id:k,ord:0,data:v})});return out}
function rowsToDb(rows){const d={};ARR_COLLS.forEach(k=>d[k]=[]);const ord={};SYNC.snap={};
 rows.forEach(r=>{if(r.deleted)return;SYNC.snap[r.coll+"|"+r.id]=JSON.stringify([r.ord,r.data]);if(r.coll==="meta")d[r.id]=r.data;else{(d[r.coll]=d[r.coll]||[]).push(r.data);ord[r.coll+"|"+r.id]=r.ord}});
 ARR_COLLS.forEach(k=>{if(k==="audit")d.audit.sort((a,b)=>(b.at||"")<(a.at||"")?-1:1);else d[k].sort((a,b)=>(ord[k+"|"+a.id]||0)-(ord[k+"|"+b.id]||0))});
 SYNC.last=rows.reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");return d}
async function pullAll(){const all=[];for(let from=0;;from+=1000){const{data,error}=await SYNC.sb.from("dme_records").select("coll,id,ord,data,deleted,updated_at").order("coll").order("id").range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}return all}

/* ---------- saving ---------- */
SYNC.dirty=()=>{SYNC.pending=true;syncBadge();clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>syncPush(),700)};
async function syncPush(all,prog){if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;clearTimeout(SYNC.t);
 try{const rows=dbRows(),seen=new Set(),up=[];rows.forEach(r=>{const k=r.coll+"|"+r.id;seen.add(k);const j=JSON.stringify([r.ord,r.data]);if(all||SYNC.snap[k]!==j)up.push({...r,deleted:false,_j:j})});
  Object.keys(SYNC.snap).forEach(k=>{if(!seen.has(k)){const[coll,...id]=k.split("|");up.push({coll,id:id.join("|"),ord:0,data:null,deleted:true,_j:null})}});
  for(let i=0;i<up.length;i+=200){const part=up.slice(i,i+200);if(prog)prog(Math.min(i+200,up.length),up.length);
   const{error}=await SYNC.sb.from("dme_records").upsert(part.map(({_j,...r})=>r),{onConflict:"coll,id"});if(error)throw error;
   part.forEach(r=>{const k=r.coll+"|"+r.id;if(r.deleted)delete SYNC.snap[k];else SYNC.snap[k]=r._j})}
  SYNC.pending=false;SYNC.err=null}
 catch(e){SYNC.err=e.code==="42501"||/row-level security/i.test(e.message||"")?"view":(e.message||String(e));if(all)throw e}
 finally{SYNC.busy=false;syncBadge();if(SYNC.again){SYNC.again=false;syncPush()}}
 if(SYNC.err==="view"){toast(SYNC.role==="Viewer"?"You have view-only access. That change was not saved.":"You don't have permission for that change. It was not saved.");SYNC.pending=false;const rows=await pullAll();DB=rowsToDb(rows);regAll();render()}}
window.addEventListener("beforeunload",e=>{if(SYNC.on&&SYNC.pending){syncPush();e.preventDefault();e.returnValue=""}});

/* ---------- picking up other people's changes ---------- */
async function syncPull(){if(!SYNC.on||SYNC.busy||document.hidden)return;
 const since=SYNC.last?new Date(new Date(SYNC.last).getTime()-15000).toISOString():"1970-01-01";
 const{data,error}=await SYNC.sb.from("dme_records").select("coll,id,ord,data,deleted,updated_at").gt("updated_at",since).order("updated_at").limit(1000);
 if(error){SYNC.err=error.message;syncBadge();return}if(SYNC.err&&SYNC.err!=="view"&&!SYNC.pending){SYNC.err=null;syncBadge()}
 const local=new Map(dbRows().map(r=>[r.coll+"|"+r.id,JSON.stringify([r.ord,r.data])]));let changed=0;
 data.forEach(r=>{if(r.updated_at>SYNC.last)SYNC.last=r.updated_at;const k=r.coll+"|"+r.id,j=r.deleted?null:JSON.stringify([r.ord,r.data]);
  if(j===SYNC.snap[k]||(j===null&&!(k in SYNC.snap)))return;
  if(local.has(k)&&local.get(k)!==SYNC.snap[k])return; /* you changed this record and it is about to be saved */
  applyRow(r);if(j===null)delete SYNC.snap[k];else SYNC.snap[k]=j;changed++});
 if(!changed)return;regAll();
 const busy=document.getElementById("overlay").innerHTML||(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("main input,main textarea,main select"));
 if(busy){SYNC.stale=true;syncBadge()}else render()}
function applyRow(r){if(r.coll==="meta"){if(!r.deleted)DB[r.id]=r.data;return}const arr=DB[r.coll]=DB[r.coll]||[];const i=arr.findIndex(x=>String(x.id)===r.id);
 if(r.deleted){if(i>=0)arr.splice(i,1);return}if(i>=0)arr[i]=r.data;else if(r.coll==="audit")arr.unshift(r.data);else arr.push(r.data)}

const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function merge3(base,mine,theirs){if(jeq(mine,base))return theirs;if(jeq(theirs,base)||jeq(mine,theirs))return mine;

  if([...mine,...theirs].every(x=>key(x)!=null)){const B=new Map((Array.isArray(base)?base:[]).map(x=>[key(x),x])),M=new Map(mine.map(x=>[key(x),x])),T=new Map(theirs.map(x=>[key(x),x])),out=[],seen=new Set();
   for(const x of [...theirs,...mine]){const k=key(x);if(seen.has(k))continue;seen.add(k);const b=B.get(k),m=M.get(k),t=T.get(k);
    if(m!==undefined&&t!==undefined)out.push(merge3(b,m,t));else if(m!==undefined){if(b===undefined||!jeq(b,m))out.push(m)}else if(b===undefined||!jeq(b,t))out.push(t)}
   return out}
  return mine}
 if(mine&&theirs&&typeof mine==="object"&&typeof theirs==="object"&&!Array.isArray(mine)&&!Array.isArray(theirs)){const o={};new Set([...Object.keys(mine),...Object.keys(theirs)]).forEach(k=>{const v=merge3(base&&typeof base==="object"?base[k]:undefined,mine[k],theirs[k]);if(v!==undefined)o[k]=v});return o}
 return mine}
/* fetch what others saved; merge it with anything you changed but have not saved yet */
async function reconcile(){const since=SYNC.last?new Date(new Date(SYNC.last).getTime()-15000).toISOString():"1970-01-01";
 const{data,error}=await SYNC.sb.from("dme_records").select("coll,id,ord,data,deleted,updated_at").gt("updated_at",since).order("updated_at").limit(1000);
 if(error)throw error;const local=new Map(dbRows().map(r=>[r.coll+"|"+r.id,r]));let changed=0,merged=0;
 data.forEach(r=>{if(r.updated_at>SYNC.last)SYNC.last=r.updated_at;const k=r.coll+"|"+r.id,j=r.deleted?null:JSON.stringify([r.ord,r.data]);
  if(j===SYNC.snap[k]||(j===null&&!(k in SYNC.snap)))return;const L=local.get(k),lj=L?JSON.stringify([L.ord,L.data]):null;
  if(lj===SYNC.snap[k]||(lj===null&&!(k in SYNC.snap))){applyRow(r);if(j===null)delete SYNC.snap[k];else SYNC.snap[k]=j;changed++;return}
  if(r.deleted){return} /* you edited something another person deleted: your version is kept and saved again */
  if(!L){applyRow(r);SYNC.snap[k]=j;changed++;return}
  const base=SYNC.snap[k]?JSON.parse(SYNC.snap[k])[1]:undefined,m=merge3(base,L.data,r.data);
  applyRow({...r,data:m});SYNC.snap[k]=j;changed++;merged++});
 if(changed)regAll();return{changed,merged}}

 const busy=document.getElementById("overlay").innerHTML||(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("main input,main textarea,main select"));
 if(busy){SYNC.stale=true;syncBadge()}else render()}

 try{if(!all){const r=await reconcile();if(r.changed&&!document.getElementById("overlay").innerHTML&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("main input,main textarea,main select")))setTimeout(render,0)}

  Object.keys(SYNC.snap).forEach(k=>{if(!seen.has(k)){const[coll,...id]=k.split("|");if(coll==="conduct"&&!canConduct())return;up.push({coll,id:id.join("|"),ord:0,data:null,deleted:true,_j:null})}});
  for(let i=0;i<up.length;i+=200){const part=up.slice(i,i+200);if(prog)prog(Math.min(i+200,up.length),up.length);
   const{error}=await SYNC.sb.from("dme_records").upsert(part.map(({_j,...r})=>r),{onConflict:"coll,id"});if(error)throw error;
   part.forEach(r=>{const k=r.coll+"|"+r.id;if(r.deleted)delete SYNC.snap[k];else SYNC.snap[k]=r._j})}
  SYNC.pending=false;SYNC.err=null}
 catch(e){SYNC.err=e.code==="42501"||/row-level security/i.test(e.message||"")?"view":(e.message||String(e));if(all)throw e}
 finally{SYNC.busy=false;syncBadge();if(SYNC.again){SYNC.again=false;syncPush()}}
 if(SYNC.err==="view"){toast(SYNC.role==="Viewer"?"You have view-only access. That change was not saved.":"You don't have permission for that change. It was not saved.");SYNC.pending=false;const rows=await pullAll();DB=rowsToDb(rows);regAll();render()}}

/* ---------- back goes exactly where you were ---------- */
const NAVSTACK=[];let navPending=null;

NAVSTACK.push({h:curHash(),y:0,t:""});

window.addEventListener("hashchange",()=>{const h=curHash(),prev=NAVSTACK[NAVSTACK.length-2];
 if(prev&&prev.h===h){NAVSTACK.pop();const y=prev.y;requestAnimationFrame(()=>{window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y))})}
 else if(NAVSTACK[NAVSTACK.length-1]?.h!==h){NAVSTACK.push({h,y:0,t:pageTitle()});if(NAVSTACK.length>60)NAVSTACK.shift()}

/* "← All PGTs" style links go back to the page you came from, and say so */

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;if(!a)return;
 if(["ex-addc","ex-excl","ex-incl"].includes(a))return examCandAction(a,b);
 if(a.startsWith("cd-"))return conductAction(a,b);
});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="ex-scope"){const x=DB.exams.find(e=>e.id===route.id);x.scope=t.value;xlog(x,`Eligibility set to ${t.value==="ric"?"active PGTs at RIC":"all active PGTs"}`);persist();render()}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.exyear!=null){UI.exYear=d.exyear;render();return}
 if(d.sdept!=null){UI.sdept=UI.sdept===d.sdept?"":d.sdept;render();return}
 if(d.stype!=null){UI.stype=d.stype;render();return}
 if(d.sload!=null){UI.sload=d.sload;render();return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sq"){UI.sq=t.value;const pos=t.selectionStart;render();const n=document.getElementById("sq");n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="sdept"){UI.sdept=t.value;render()}if(t.id==="sprog"){UI.sprog=t.value;render()}if(t.id==="fry"){UI.ry=t.value;if(t.value&&UI.phase!=="all")UI.phase="active";render()}
 if(t.dataset.exroll){const x=DB.exams.find(e=>e.id===route.id),v=t.value.trim();const dup=Object.entries(x.roll).find(([k,r])=>k!==t.dataset.exroll&&r===v&&v);if(dup){toast("That roll number is already used");t.value=x.roll[t.dataset.exroll];return}x.roll[t.dataset.exroll]=v;persist()}
});
document.addEventListener("change",e=>{const d=e.target.dataset||{};const need=d.exroll||d.exmark||d.exabs||d.expc||d.expaper||d.exsetter?"exam":d.oratt||d.orck?"orient":d.tcheck!=null||e.target.id==="tprog"?"task":d.wscheck?"ws":null;
 if(need&&route.v!==need){e.stopImmediatePropagation();return}
 if(need&&!document.body.contains(e.target)){e.stopImmediatePropagation()}},true);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.rgtab){UI.rgTab=d.rgtab;render();return}
 const a=d.act;if(!a)return;
 if(a==="ev-cancel"||a==="ev-save")return importAction(a);
 if(a==="rg-submit")return submitReg();
 if(a==="rg-again"){UI.rgDone=null;render();return}
 if(a.startsWith("rg-")){regAction(a,b);persist();render();return}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="ev-file"&&t.files[0]){readImport(t.files[0]);return}
 if(t.dataset.evmap!=null&&UI.imp){UI.imp.map[+t.dataset.evmap]=t.value;UI.imp.how[+t.dataset.evmap]=t.value?"Chosen by hand":"";render();return}
 if(t.id==="ex-pick"){UI.exPick=t.value;render();return}
 if(t.dataset.rgmove&&t.value){const w=DB.workshops.find(x=>x.id===route.id),r=regsOf(w).find(x=>x.id===t.dataset.rgmove);if(regMove(w,r,t.value)){persist();toast(`Moved to ${t.value}`)}render();return}
 if(t.dataset.rgpresent){const w=DB.workshops.find(x=>x.id===route.id),r=regsOf(w).find(x=>x.id===t.dataset.rgpresent);r.present=t.checked;regSync(w);persist();render();return}
});
window.addEventListener("hashchange",()=>{if(route.v!=="exam")UI.imp=null;if(route.v!=="reg")UI.rgDone=null});
bootApp();
</script>
