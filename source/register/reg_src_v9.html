<title>RIC PGT Registration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maroon letterhead (matches the existing DME&T dashboard), step rail, one card per step, fixed action bar */
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --sunk:#FBF8F2; --ink:#231A17; --muted:#6E625A; --line:#E2D8C8;
  --brand:#6D1F2B; --brand-deep:#521521; --brand-soft:#F3E4E1; --gold:#B08D57;
  --warn:#8A5A00; --warn-soft:#FBEFD6; --ok:#2F6B45; --ok-soft:#E4F1E7; --err:#A1262F;
  --f-display:"Source Serif 4",Georgia,serif; --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17110F; --surface:#221917; --sunk:#1C1513; --ink:#F1E9E1; --muted:#B3A398; --line:#3A2E2A;
  --brand:#D98A92; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A;
  --warn:#F0C070; --warn-soft:#3A2C12; --ok:#8FD3A5; --ok-soft:#173022; --err:#F08A90; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110F; --surface:#221917; --sunk:#1C1513; --ink:#F1E9E1; --muted:#B3A398; --line:#3A2E2A;
  --brand:#D98A92; --brand-deep:#521521; --brand-soft:#3A2224; --gold:#D1B07A;
  --warn:#F0C070; --warn-soft:#3A2C12; --ok:#8FD3A5; --ok-soft:#173022; --err:#F08A90; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-deep)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.lh{background:linear-gradient(135deg,#6D1F2B,#521521);color:#fff;border-bottom:3px solid var(--gold)}
header.lh .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.lh img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.lh .t{flex:1;min-width:0}
.lh .inst{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.lh h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,5vw,28px);margin:2px 0 0;line-height:1.15}
.lh .sub{font-size:13px;opacity:.85}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rail button{width:100%;border:none;background:none;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;padding:0;text-align:left;display:grid;gap:5px}
.rail button::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.rail button.done::before{background:var(--gold)}
.rail button[aria-current="step"]{color:var(--ink);font-weight:600}
.rail button[aria-current="step"]::before{background:var(--brand)}
main{padding-block:18px 120px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0;line-height:1.2}
.lede{color:var(--muted);margin:-8px 0 0;font-size:15px}
.grid{display:grid;gap:14px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:5px;min-width:0}
label.f>span,.lbl{font-size:14px;font-weight:600}
.req::after{content:" *";color:var(--brand)}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.err{font-size:13px;color:var(--err)}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono);letter-spacing:.02em}
input[aria-invalid="true"]{border-color:var(--err)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.calc{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 18px}
.calc b{font-variant-numeric:tabular-nums}
.note{border-radius:8px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
/* documents */
.docs{display:grid;gap:12px}
@media(min-width:560px){.docs{grid-template-columns:1fr 1fr}}
.doc{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;background:var(--sunk);position:relative}
.doc.has{border-style:solid;border-color:var(--ok);background:var(--surface)}
.doc .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.doc .dh b{font-size:15px}
.doc .prev{height:120px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center;padding:6px}
.doc .prev img{width:100%;height:100%;object-fit:contain}
.doc.photo .prev{width:110px;height:136px;justify-self:center}
.doc.photo .prev img{object-fit:cover}
.doc .meta{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.doc input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.btn{font:600 15px var(--f-body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.btn{display:inline-block}
dl.sum{display:grid;grid-template-columns:minmax(110px,36%) 1fr;gap:6px 14px;margin:0;font-size:15px}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.ref{font-family:var(--f-mono);font-size:20px;background:var(--sunk);border:1px dashed var(--gold);border-radius:8px;padding:10px 14px;display:inline-block}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.bar .saved{flex:1;font-size:13px;color:var(--muted);min-width:0}
</style>

<header class="lh"><div class="wrap">
  <img src="__RIC__" alt="RIC logo">
  <div class="t"><div class="inst">Rawalpindi Institute of Cardiology</div><h1>PGT Registration</h1><div class="sub">Medical Education and Training · fill once when you join RIC</div></div>
</div></header>
<nav class="rail" aria-label="Steps"><div class="wrap"><ol id="rail"></ol></div></nav>
<main class="wrap" id="app"></main>
<div class="bar"><div class="wrap">
  <button class="btn" id="back">Back</button>
  <span class="saved" id="saved">Your typed details are kept on this phone until you submit.</span>
  <button class="btn primary" id="next">Next</button>
</div></div>

<script>
let SPECS=["General Cardiology","Cardiac Surgery","Anaesthesiology","Cardiothoracic Anaesthesia","Radiology","Interventional Cardiology","Paediatric Cardiology","Paediatric Cardiac Surgery","Electrophysiology"];
let DUR={"General Cardiology":{"FCPS":5,"UHS (MD)":5},"Cardiac Surgery":{"FCPS":5,"UHS (MS)":5},"Anaesthesiology":{"FCPS":4,"UHS (MS)":5},"Cardiothoracic Anaesthesia":{"FCPS":5},"Radiology":{"FCPS":4},"Interventional Cardiology":{"FCPS":2,"UHS (MS)":2},"Paediatric Cardiology":{"FCPS":3,"UHS (MD)":3},"Paediatric Cardiac Surgery":{"FCPS":3},"Electrophysiology":{"FCPS":2}};
let SUP=__SUP__;
const PROGRAMS=["FCPS","UHS (MS)","UHS (MD)"];
const STEPS=["Personal","Training","Posting","Documents","Submit"];
let SITES=[["HFH","Holy Family Hospital"],["BBH","Benazir Bhutto Hospital"],["CMH","Combined Military Hospital"],["DHQ","DHQ Hospital"],["Other","Other hospital"]];
const DUTY=[["RIC","Posted at RIC"],["Rotation","On rotation"],["Frozen","Training frozen"]];
const DOCS=[
 {k:"photo",l:"Passport photo",h:"Clear face, plain background. JPG or PNG.",img:1},
 {k:"cnic",l:"CNIC copy",h:"Front and back on one page, image or PDF."},
 {k:"pmdc",l:"PMDC registration",h:"Current PMDC certificate or card."},
 {k:"joining",l:"Joining letter",h:"Your RIC joining letter / report."}
];
const MAX=5*1024*1024;
const KEY="ric-pgt-reg-v1";
const blank=()=>({step:0,name:"",father:"",cnic:"",pmdc:"",mobile:"",email:"",domicile:"",program:"",spec:"",sup:"",supOther:"",start:"",dur:"",year:"",comp:"",compEdited:false,duty:"",site:"",siteOther:"",rotStart:"",ret:"",frozenSince:"",ok:false,done:null});
let S;try{S={...blank(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){S=blank()}
const FILES={};          // files never go to localStorage
let touched=new Set();
const save=()=>{try{const{done,...k}=S;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- formatting & validation ---- */
const fmtCnic=v=>{const d=v.replace(/\D/g,"").slice(0,13);return d.length>12?`${d.slice(0,5)}-${d.slice(5,12)}-${d.slice(12)}`:d.length>5?`${d.slice(0,5)}-${d.slice(5)}`:d};
const fmtMob=v=>{let d=v.replace(/\D/g,"");if(d.startsWith("92"))d="0"+d.slice(2);d=d.slice(0,11);return d.length>4?`${d.slice(0,4)}-${d.slice(4)}`:d};
const RULES={
 name:v=>v.trim().length>=3||"Enter your full name.",
 father:v=>v.trim().length>=3||"Enter your father's name.",
 cnic:v=>/^\d{5}-\d{7}-\d$/.test(v)||"CNIC must be 13 digits, e.g. 37405-1234567-1.",
 pmdc:v=>/^[0-9]{3,7}-?[A-Z]?$/i.test(v.trim())||"Enter your PMDC number, e.g. 93232-P.",
 mobile:v=>/^03\d{2}-\d{7}$/.test(v)||"Mobile must be 11 digits starting with 03, e.g. 0335-6072567.",
 email:v=>!v||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)||"Check the email address.",
 domicile:v=>v.trim().length>=2||"Enter your district of domicile.",
 program:v=>!!v||"Choose your programme.",
 spec:v=>!!v||"Choose your specialty.",
 sup:v=>!!v&&(v!=="other"||S.supOther.trim().length>=3)||"Choose your supervisor.",
 start:v=>{if(!v)return"Enter your training start date.";const d=new Date(v);return d<=new Date(Date.now()+90*864e5)&&d>=new Date("2015-01-01")||"Check the start date."},
 dur:v=>+v>0||"Choose the training duration.",
 comp:v=>{if(!v)return"Enter your expected completion date.";return!S.start||v>S.start||"Completion must be after the start date."},
 duty:v=>!!v||"Choose where you are posted now.",
 site:v=>S.duty!=="Rotation"||(!!v&&(v!=="Other"||S.siteOther.trim().length>=3))||"Choose the hospital you are rotating at.",
 rotStart:v=>S.duty!=="Rotation"||!!v||"Enter the date your rotation started.",
 ret:v=>{if(S.duty!=="Rotation")return true;if(!v)return"Enter your expected return date to RIC.";return!S.rotStart||v>S.rotStart||"Return must be after the rotation start."},
 frozenSince:v=>S.duty!=="Frozen"||!!v||"Enter the date your training was frozen."
};
const STEPF=[["name","father","cnic","pmdc","mobile","email","domicile"],["program","spec","sup","start","dur","comp"],["duty","site","rotStart","ret","frozenSince"],[],[]];
const errOf=k=>{const r=RULES[k](S[k]);return r===true?"":r};
const stepOk=i=>i===3?DOCS.every(d=>FILES[d.k]):STEPF[i].every(k=>!errOf(k));
const showErr=k=>touched.has(k)&&errOf(k);

const fld=(k,label,o={})=>`<label class="f"><span class="${o.opt?"":"req"}">${label}${o.hint?` <span class="hint">${o.hint}</span>`:""}</span>
<input id="${k}" data-k="${k}" value="${esc(S[k])}" ${o.type?`type="${o.type}"`:""} ${o.mode?`inputmode="${o.mode}"`:""} ${o.ph?`placeholder="${o.ph}"`:""} ${o.ac?`autocomplete="${o.ac}"`:""} class="${o.mono?"mono":""}" aria-invalid="${!!showErr(k)}" aria-describedby="${k}-e">
<span class="err" id="${k}-e">${showErr(k)||""}</span></label>`;

/* ---- dates ---- */
const addYears=(s,y)=>{const d=new Date(s+"T00:00");d.setMonth(d.getMonth()+Math.round(y*12));d.setDate(d.getDate()-1);return d};
const dfmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const yearOf=s=>{const n=Math.floor((Date.now()-new Date(s+"T00:00"))/(365.25*864e5))+1;return Math.max(1,Math.min(n,Math.ceil(+S.dur||5)))};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function autoFill(){if(S.start&&+S.dur){if(!S.compEdited)S.comp=iso(addYears(S.start,+S.dur));if(!S.year||+S.year>Math.ceil(+S.dur))S.year=String(yearOf(S.start))}}
const session=d=>(d.getMonth()<6?"Jan ":"Jul ")+String(d.getFullYear()).slice(2);

/* ---- views ---- */
function v0(){return`<section class="card"><h2>Personal details</h2><p class="lede">Write your name exactly as on your PMDC certificate. Do not add "Dr."</p>
${fld("name","Full name",{ph:"e.g. Ayesha Khan",ac:"name"})}
${fld("father","Father's name")}
<div class="grid two">${fld("cnic","CNIC",{mode:"numeric",ph:"37405-1234567-1",mono:1})}${fld("pmdc","PMDC number",{ph:"93232-P",mono:1})}</div>
<div class="grid two">${fld("mobile","Mobile",{type:"tel",mode:"numeric",ph:"03xx-xxxxxxx",mono:1,ac:"tel"})}${fld("email","Email",{type:"email",opt:1,hint:"optional",ac:"email"})}</div>
${fld("domicile","Domicile (district)",{ph:"e.g. Sargodha"})}
</section>`}

function supOpts(){if(!S.spec||!S.program)return[];const fc=S.program==="FCPS";return SUP.filter(s=>s.s===S.spec&&(fc?s.c:s.u))}
function v1(){const avail=S.spec?Object.keys(DUR[S.spec]||{}):PROGRAMS;const sups=supOpts();
const calc=S.start&&+S.dur?(()=>{const end=addYears(S.start,+S.dur);return`<div class="calc"><span>Expected completion <b>${dfmt(end)}</b></span><span>Induction <b>${session(new Date(S.start+"T00:00"))}</b></span></div>`})():"";
return`<section class="card"><h2>Training details</h2>
<div class="f"><span class="lbl req">Specialty</span><select id="spec" data-k="spec"><option value="">Choose specialty</option>${SPECS.map(s=>`<option ${s===S.spec?"selected":""}>${s}</option>`).join("")}</select><span class="err">${showErr("spec")||""}</span></div>
<div class="f"><span class="lbl req">Programme</span><div class="seg">${PROGRAMS.map(p=>`<button type="button" data-prog="${p}" aria-pressed="${S.program===p}" ${S.spec&&!avail.includes(p)?"disabled":""}>${p}</button>`).join("")}</div>
${S.spec&&avail.length<3?`<span class="hint">${S.spec} at RIC is offered as ${avail.join(" and ")}.</span>`:""}<span class="err">${showErr("program")||""}</span></div>
<div class="f"><span class="lbl req">Supervisor</span>
<select id="sup" data-k="sup" ${!S.spec||!S.program?"disabled":""}><option value="">${!S.spec||!S.program?"Choose specialty and programme first":"Choose supervisor"}</option>
${sups.map(s=>`<option ${s.n===S.sup?"selected":""}>${esc(s.n)}</option>`).join("")}<option value="other" ${S.sup==="other"?"selected":""}>My supervisor is not listed</option></select>
<span class="hint">Shows ${S.program==="FCPS"?"CPSP":S.program?"UHS":"approved"} supervisors in your specialty.</span><span class="err">${showErr("sup")||""}</span></div>
${S.sup==="other"?`<label class="f"><span class="req">Supervisor's name</span><input id="supOther" data-k="supOther" value="${esc(S.supOther)}" placeholder="The DME&T office will confirm"></label>`:""}
<div class="grid two">${fld("start","Training start date",{type:"date",hint:"as on your RTMC / enrolment letter"})}
<div class="f"><span class="lbl req">Duration</span><select id="dur" data-k="dur" ${!S.program?"disabled":""}><option value="">—</option>${[2,3,4,5].map(y=>`<option value="${y}" ${+S.dur===y?"selected":""}>${y} years</option>`).join("")}</select>
<span class="hint">${S.spec&&S.program&&DUR[S.spec]?.[S.program]?`Standard for this programme: ${DUR[S.spec][S.program]} years`:"Set automatically"}</span></div></div>
${calc}
${S.start&&+S.dur?(()=>{const cy=yearOf(S.start),ce=iso(addYears(S.start,+S.dur));return`<div class="grid two">

${fld("comp","Expected completion date",{type:"date",hint:S.comp&&S.comp!==ce?`calculated: ${dfmt(new Date(ce+"T00:00"))}`:""})}</div>
<span class="hint">Change the completion date only if your training was extended, frozen or re-scheduled.</span>`})():""}
</section>`}

function v2(){const r=S.duty==="Rotation";return`<section class="card"><h2>Current posting</h2><p class="lede">Where you are working right now.</p>
<div class="f"><span class="lbl req">Current status</span><div class="seg">${DUTY.map(([k,l])=>`<button type="button" data-duty="${k}" aria-pressed="${S.duty===k}">${l}</button>`).join("")}</div><span class="err">${showErr("duty")||""}</span></div>
${S.duty==="RIC"?`<div class="note ok">Place of duty: Rawalpindi Institute of Cardiology</div>`:""}
${r?`<div class="f"><span class="lbl req">Place of duty</span><select id="site" data-k="site"><option value="">Choose hospital</option>${SITES.map(([k,l])=>`<option value="${k}" ${S.site===k?"selected":""}>${l}${k!=="Other"?" ("+k+")":""}</option>`).join("")}</select><span class="err">${showErr("site")||""}</span></div>
${S.site==="Other"?`<label class="f"><span class="req">Hospital name</span><input id="siteOther" data-k="siteOther" value="${esc(S.siteOther)}"></label>`:""}
<div class="grid two">${fld("rotStart","Rotation started on",{type:"date"})}${fld("ret","Expected return to RIC",{type:"date"})}</div>`:""}
${S.duty==="Frozen"?`${fld("frozenSince","Frozen since",{type:"date"})}<div class="note warn">The DME&T office will contact you to record the reason and the expected resumption date.</div>`:""}
</section>`}

function docCard(d){const f=FILES[d.k];return`<div class="doc ${d.img?"photo":""} ${f?"has":""}">
<div class="dh"><b class="req">${d.l}</b>${f?`<span class="hint" style="color:var(--ok)">Added</span>`:""}</div>
<div class="prev">${f?(f.url?`<img src="${f.url}" alt="${d.l} preview">`:`PDF<br>${esc(f.name)}`):d.h}</div>
${f?`<span class="meta">${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB</span>`:""}
<span class="err" id="e-${d.k}"></span>
<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn small" for="file-${d.k}">${f?"Replace":"Choose file or take photo"}</label>
<input type="file" id="file-${d.k}" data-file="${d.k}" accept="${d.img?"image/jpeg,image/png,image/webp":"image/jpeg,image/png,image/webp,application/pdf"}"></div></div>`}
function v3(){const n=DOCS.filter(d=>FILES[d.k]).length;return`<section class="card"><h2>Documents</h2>
<p class="lede">Upload all four. Each file up to 5 MB. A clear phone photo is fine.</p>
<div class="docs">${DOCS.map(docCard).join("")}</div>
<div class="note ${n===4?"ok":"warn"}">${n} of 4 documents added.</div></section>`}

function v4(){const miss=STEPS.slice(0,4).map((s,i)=>stepOk(i)?null:[s,i]).filter(Boolean);const sup=S.sup==="other"?S.supOther+" (not listed)":S.sup;
return`<section class="card"><h2>Check and submit</h2>
${miss.length?`<div class="note warn">Still needed: ${miss.map(([s,i])=>`<button class="btn small" data-go="${i}" style="margin:4px 4px 0 0">${s}</button>`).join("")}</div>`:""}
${FILES.photo?`<img src="${FILES.photo.url}" alt="Your photo" style="width:84px;height:104px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`:""}
<dl class="sum"><dt>Name</dt><dd>Dr. ${esc(S.name)||"—"}</dd><dt>Father's name</dt><dd>${esc(S.father)||"—"}</dd>
<dt>CNIC</dt><dd>${esc(S.cnic)||"—"}</dd><dt>PMDC</dt><dd>${esc(S.pmdc.toUpperCase())||"—"}</dd><dt>Mobile</dt><dd>${esc(S.mobile)||"—"}</dd>
${S.email?`<dt>Email</dt><dd>${esc(S.email)}</dd>`:""}<dt>Domicile</dt><dd>${esc(S.domicile)||"—"}</dd>
<dt>Programme</dt><dd>${esc(S.program)||"—"} · ${esc(S.spec)||"—"}</dd><dt>Supervisor</dt><dd>${esc(sup)||"—"}</dd>
<dt>Training</dt><dd>${S.start?dfmt(new Date(S.start+"T00:00")):"—"}${S.start&&+S.dur?" to "+dfmt(addYears(S.start,+S.dur)):""} (${S.dur||"—"} years)</dd>
<dt>Expected completion</dt><dd>${S.comp?dfmt(new Date(S.comp+"T00:00")):"—"}</dd>
<dt>Posting</dt><dd>${S.duty==="RIC"?"Posted at RIC":S.duty==="Rotation"?`On rotation at ${esc(S.site==="Other"?S.siteOther:(SITES.find(x=>x[0]===S.site)||["",""])[1])}${S.rotStart?" since "+dfmt(new Date(S.rotStart+"T00:00")):""}${S.ret?", returning "+dfmt(new Date(S.ret+"T00:00")):""}`:S.duty==="Frozen"?`Training frozen${S.frozenSince?" since "+dfmt(new Date(S.frozenSince+"T00:00")):""}`:"—"}</dd>
<dt>Documents</dt><dd>${DOCS.filter(d=>FILES[d.k]).length} of 4</dd></dl>
<label class="check"><input type="checkbox" id="ok" ${S.ok?"checked":""}><span>The information and documents I have given are correct. I will inform the DME&T office of any change in my training, rotation or contact details.</span></label>
<button class="btn primary" data-act="submit" ${miss.length||!S.ok?"disabled":""} style="justify-self:start">Submit registration</button></section>`}

function vDone(){return`<section class="card"><h2>Registration received</h2>
<p class="lede">Thank you, Dr. ${esc(S.name)}. The DME&T office will verify your details and documents.</p>
<div><span class="hint">${LIVE?"Your RIC PGT ID (confirmed once the DME&T office verifies your registration)":"Your reference"}</span><br><span class="ref">${esc(S.done.ref)}</span></div>
<span class="hint">Submitted ${esc(S.done.at)}. Keep this reference; quote it if you contact the DME&T office.</span>
<ol class="steps"><li>The DME&T office checks your details against your documents.</li><li>Once verified, you get your RIC PGT number.</li><li>If anything needs correcting, the office will contact you on ${esc(S.mobile)}.</li></ol>
${LIVE?"":`<div class="note warn">Prototype: nothing was sent. In the live version this goes into the DME&T app's "Pending verification" list.</div>`}
<button class="btn" data-act="reset" style="justify-self:start">Start a new registration</button></section>`}


/* ---------- live: lists from the DME&T database, submission to Supabase ---------- */
const SUPA=(window.DME_SUPABASE&&window.DME_SUPABASE.url&&window.DME_SUPABASE.anonKey)?window.DME_SUPABASE:null,LIVE=!!SUPA;let SB=null;
function sbReady(){if(SB)return Promise.resolve(SB);return new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js";s.onload=()=>{SB=window.supabase.createClient(SUPA.url,SUPA.anonKey,{auth:{persistSession:false}});ok(SB)};s.onerror=()=>no(new Error("Could not connect"));document.head.append(s)})}
if(LIVE)sbReady().then(sb=>sb.rpc("dme_public_lists")).then(({data})=>{if(!data)return;
 if((data.specs||[]).length){const sp=data.specs.filter(x=>x.active!==false&&x.teaching!==false&&x.dur&&Object.keys(x.dur).length);if(sp.length){SPECS=sp.map(x=>x.name);DUR=Object.fromEntries(sp.map(x=>[x.name,Object.fromEntries(Object.entries(x.dur).filter(([k,v])=>+v>0).map(([k,v])=>[k,+v]))]))}}
 if((data.faculty||[]).length)SUP=data.faculty.filter(f=>f.c||f.u);
 if((data.sites||[]).length)SITES=[...data.sites.filter(x=>x.active!==false).map(x=>[x.short,x.name]),["Other","Other hospital"]];
 if(!S.done)render()}).catch(()=>{});
async function liveSubmit(b){b.disabled=true;const old=b.textContent;b.textContent="Uploading documents…";
 const fail=m=>{b.disabled=false;b.textContent=old;let el=document.getElementById("suberr");if(!el){el=document.createElement("p");el.id="suberr";el.className="note warn";b.after(el)}el.textContent=m};
 try{const sb=await sbReady();const folder="pgt/"+Date.now()+"-"+Math.random().toString(36).slice(2,8);const docs={};
  for(const d of DOCS){const f=FILES[d.k];if(!f||!f.file)return fail("Attach the "+d.l.toLowerCase()+" again (files are not kept if the page was reloaded).");
   const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${folder}/${d.k}.${ext}`;
   const{error}=await sb.storage.from("dme-uploads").upload(path,f.file,{contentType:f.type||undefined});if(error)return fail("A document could not be uploaded. Check the connection and try again.");docs[d.k]=path}
  b.textContent="Sending…";const p={...S,docs,sup:S.sup==="other"?"":S.sup,supOther:S.sup==="other"?S.supOther:""};delete p.done;delete p.step;delete p.ok;
  const{data,error}=await sb.rpc("dme_submit_pgt",{p});if(error||!data)return fail("Could not send. Check the connection and try again.");
  if(data.error)return fail(data.error==="duplicate"?"A registration with this CNIC already exists. Contact the DME&T office.":"Some details are missing or not valid. Check each step.");
  S.done={ref:data.ref,at:new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})};save();render()}catch(e){fail("Could not send. Check the connection and try again.")}}
const V=[v0,v1,v2,v3,v4];
function render(){
 document.getElementById("rail").innerHTML=STEPS.map((s,i)=>`<li><button data-go="${i}" class="${i<S.step&&stepOk(i)?"done":""}" ${i===S.step&&!S.done?'aria-current="step"':""}>${s}</button></li>`).join("");
 document.getElementById("app").innerHTML=S.done?vDone():V[S.step]();
 const b=document.getElementById("back"),n=document.getElementById("next");
 b.disabled=S.step===0||!!S.done;n.hidden=S.step===4||!!S.done;n.textContent=S.step===3?"Review":"Next";
 window.scrollTo(0,0);
}
const app=document.body;
app.addEventListener("input",e=>{const k=e.target.dataset.k;if(!k||e.target.tagName==="SELECT")return;let v=e.target.value;
 if(k==="cnic"){v=fmtCnic(v);e.target.value=v}if(k==="mobile"){v=fmtMob(v);e.target.value=v}
 S[k]=v;save();if(touched.has(k)){const er=errOf(k);e.target.setAttribute("aria-invalid",!!er);document.getElementById(k+"-e").textContent=er}});
app.addEventListener("focusout",e=>{const k=e.target.dataset.k;if(!k||!RULES[k])return;touched.add(k);const er=errOf(k);e.target.setAttribute("aria-invalid",!!er);const el=document.getElementById(k+"-e");if(el)el.textContent=er});
app.addEventListener("change",e=>{const t=e.target;
 if(t.id==="ok"){S.ok=t.checked;save();render();return}
 if(t.dataset.file){const f=t.files[0],k=t.dataset.file,er=document.getElementById("e-"+k);if(!f)return;
  if(f.size>MAX){er.textContent=`This file is ${(f.size/1048576).toFixed(1)} MB. Use a file under 5 MB.`;return}
  if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)||(k==="photo"&&!f.type.startsWith("image/"))){er.textContent=k==="photo"?"Use a JPG or PNG photo.":"Use an image (JPG, PNG) or a PDF.";return}
  if(FILES[k]?.url)URL.revokeObjectURL(FILES[k].url);
  FILES[k]={file:f,type:f.type,name:f.name,size:f.size,url:f.type.startsWith("image/")?URL.createObjectURL(f):null};const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.k==="start"){S.start=t.value;autoFill();save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.k==="comp"){S.comp=t.value;S.compEdited=true;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 const k=t.dataset.k;if(!k||t.tagName!=="SELECT")return;S[k]=t.value;touched.add(k);
 if(k==="spec"){if(S.program&&!DUR[S.spec]?.[S.program])S.program="";S.sup="";if(S.program)S.dur=String(DUR[S.spec][S.program])}
 if(k==="site"&&S.site!=="Other")S.siteOther="";
 autoFill();
 save();const y=window.scrollY;render();window.scrollTo(0,y)});
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.go!=null){S.step=+b.dataset.go;save();render();return}
 if(b.dataset.prog){S.program=b.dataset.prog;S.sup="";if(S.spec&&DUR[S.spec]?.[S.program])S.dur=String(DUR[S.spec][S.program]);touched.add("program");autoFill();save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.duty){S.duty=b.dataset.duty;touched.add("duty");save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.act==="submit"){if(LIVE)return liveSubmit(b);S.done={ref:"REG-"+Math.random().toString(16).slice(2,10).toUpperCase(),at:new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})};save();render();return}
 if(b.dataset.act==="reset"){S=blank();for(const k in FILES)delete FILES[k];touched=new Set();save();render()}});
document.getElementById("back").onclick=()=>{if(S.step>0){S.step--;save();render()}};
document.getElementById("next").onclick=()=>{STEPF[S.step].forEach(k=>touched.add(k));
 if(!stepOk(S.step)&&S.step<3){render();const f=document.querySelector('[aria-invalid="true"]');if(f){f.focus();f.scrollIntoView({block:"center"})}return}
 S.step++;save();render()};
render();
</script>
